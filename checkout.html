<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<title>Finalizar Compra - JP Variedades</title>
<style>
:root{--bg:#0a0a0a;--card:#141414;--border:#252525;--text:#fff;--muted:#999;--accent:#00e676;--accent-dark:#00c853;--danger:#ff5252}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* LOADING */
#loadingScreen{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .4s}
#loadingScreen.hide{opacity:0;pointer-events:none}
.spinner{width:48px;height:48px;border:4px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.header{background:var(--card);border-bottom:1px solid var(--border);padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.voltar{color:var(--text);text-decoration:none;font-size:22px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--border)}
.logo{font-weight:800;font-size:16px}

.container{max-width:600px;margin:auto;padding:16px 16px 50px}

/* RESUMO CARRINHO */
.resumo-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:16px}
.resumo-card h3{font-size:14px;margin-bottom:10px;color:var(--muted)}
.item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.item:last-child{border-bottom:none}
.item img{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--border)}
.item .info{flex:1}
.item .nome{font-size:13px;font-weight:600}
.item .preco{color:var(--accent);font-size:14px;font-weight:700;margin-top:2px}
.item .qty{font-size:12px;color:var(--muted)}
.total-box{display:flex;justify-content:space-between;padding-top:10px;font-size:16px;font-weight:800}
.total-box span:last-child{color:var(--accent)}

/* FORM */
.form-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px}
.form-card h3{font-size:14px;margin-bottom:14px;color:var(--muted)}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
.field input,.field select{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;outline:none}
.field input:focus,.field select:focus{border-color:var(--accent)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

/* PIX INFO */
.pix-info{background:#0d2818;border:1px solid #1a4a2e;border-radius:10px;padding:12px;margin-bottom:16px;font-size:13px;line-height:1.6}
.pix-info strong{color:var(--accent)}

/* BTN */
.btn{width:100%;border:0;border-radius:12px;padding:16px;background:var(--accent);color:#000;font-size:16px;font-weight:800;cursor:pointer;margin-top:4px;text-align:center}
.btn:disabled{background:var(--border);color:var(--muted);cursor:not-allowed}
.btn-outline{background:transparent;border:1px solid var(--accent);color:var(--accent);margin-top:10px}

/* TOAST */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--card);color:var(--text);padding:12px 20px;border-radius:50px;font-size:13px;border:1px solid var(--border);z-index:3000;display:none;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.toast.show{display:block}
.toast.error{border-color:var(--danger);color:var(--danger)}

/* ERRO BOX */
.erro-box{background:#2a0a0a;border:1px solid #5a1a1a;color:#ff8a8a;padding:12px;border-radius:10px;margin-bottom:15px;text-align:center;font-size:13px;display:none}
.erro-box.show{display:block}
</style>
</head>
<body>

<div id="loadingScreen">
  <div class="spinner"></div>
  <div style="color:var(--muted);font-size:14px">Preparando checkout...</div>
</div>

<div class="header">
  <a href="index.html" class="voltar">←</a>
  <div class="logo">JP_variedades ✓</div>
</div>

<div class="container">

  <div class="resumo-card">
    <h3>📦 Resumo do pedido</h3>
    <div id="itemsList"></div>
    <div class="total-box"><span>Total</span><span id="totalValor">R$ 0,00</span></div>
  </div>

  <div class="pix-info">
    <strong>💳 Pagamento via Pix</strong><br>
    Você será redirecionado para o Mercado Pago. O pagamento é processado em segundos e seu pedido é confirmado automaticamente.
  </div>

  <div class="erro-box" id="erroBox"></div>

  <div class="form-card">
    <h3>👤 Dados pessoais</h3>
    <div class="field">
      <label>Nome completo *</label>
      <input type="text" id="nome" placeholder="Ex: João Silva">
    </div>
    <div class="field-row">
      <div class="field">
        <label>CPF *</label>
        <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" oninput="maskCPF(this)">
      </div>
      <div class="field">
        <label>Telefone (WhatsApp) *</label>
        <input type="text" id="telefone" placeholder="(00) 00000-0000" maxlength="15" oninput="maskTel(this)">
      </div>
    </div>
    <div class="field">
      <label>E-mail</label>
      <input type="email" id="email" placeholder="seu@email.com">
    </div>
  </div>

  <div class="form-card">
    <h3>📍 Endereço de entrega</h3>
    <div class="field-row-3">
      <div class="field" style="grid-column:span 1">
        <label>CEP *</label>
        <input type="text" id="cep" placeholder="00000-000" maxlength="9" oninput="maskCEP(this);buscarCEP(this.value)">
      </div>
      <div class="field" style="grid-column:span 2">
        <label>Rua / Avenida *</label>
        <input type="text" id="endereco" placeholder="Nome da rua">
      </div>
    </div>
    <div class="field-row-3">
      <div class="field">
        <label>Número *</label>
        <input type="text" id="numero" placeholder="123">
      </div>
      <div class="field">
        <label>Complemento</label>
        <input type="text" id="complemento" placeholder="Apto, bloco...">
      </div>
      <div class="field">
        <label>Bairro *</label>
        <input type="text" id="bairro" placeholder="Bairro">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Cidade *</label>
        <input type="text" id="cidade" placeholder="Cidade">
      </div>
      <div class="field">
        <label>Estado *</label>
        <select id="estado">
          <option value="">UF</option>
          <option value="AC">AC</option><option value="AL">AL</option><option value="AP">AP</option><option value="AM">AM</option>
          <option value="BA">BA</option><option value="CE">CE</option><option value="DF">DF</option><option value="ES">ES</option>
          <option value="GO">GO</option><option value="MA">MA</option><option value="MT">MT</option><option value="MS">MS</option>
          <option value="MG">MG</option><option value="PA">PA</option><option value="PB">PB</option><option value="PR">PR</option>
          <option value="PE">PE</option><option value="PI">PI</option><option value="RJ">RJ</option><option value="RN">RN</option>
          <option value="RS">RS</option><option value="RO">RO</option><option value="RR">RR</option><option value="SC">SC</option>
          <option value="SP">SP</option><option value="SE">SE</option><option value="TO">TO</option>
        </select>
      </div>
    </div>
  </div>

  <button class="btn" id="btnPagar" onclick="finalizarCompra()">PAGAR COM PIX →</button>
  <a href="index.html" class="btn btn-outline">← Continuar comprando</a>

</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL='https://ocheynyjboagfybazcsi.supabase.co';
const SUPABASE_KEY='sb_publishable_kL_nA7Fv-uHbC5mx8Hqm6A_XluBgT29';
const API_URL='/api/checkout'; // Altere para sua URL da Vercel se necessário

let cart=[];

function fmt(p){return'R$ '+p.toFixed(2).replace('.',',')}
function toast(m,err){const t=document.getElementById('toast');t.textContent=m;t.className='toast'+(err?' error':'')+' show';setTimeout(()=>t.classList.remove('show'),3000)}
function showErro(m){const b=document.getElementById('erroBox');b.textContent=m;b.classList.add('show')}
function hideErro(){document.getElementById('erroBox').classList.remove('show')}

/* MASCARAS */
function maskCPF(el){let v=el.value.replace(/\D/g,'');v=v.replace(/(\d{3})(\d)/,'$1.$2');v=v.replace(/(\d{3})(\d)/,'$1.$2');v=v.replace(/(\d{3})(\d{1,2})$/,'$1-$2');el.value=v}
function maskTel(el){let v=el.value.replace(/\D/g,'');if(v.length>10){v=v.replace(/(\d{2})(\d)/,'($1) $2');v=v.replace(/(\d{5})(\d)/,'$1-$2')}else{v=v.replace(/(\d{2})(\d)/,'($1) $2');v=v.replace(/(\d{4})(\d)/,'$1-$2')}el.value=v}
function maskCEP(el){let v=el.value.replace(/\D/g,'');v=v.replace(/(\d{5})(\d)/,'$1-$2');el.value=v}

/* BUSCA CEP */
async function buscarCEP(v){
  const cep=v.replace(/\D/g,'');
  if(cep.length!==8)return;
  try{
    const r=await fetch('https://viacep.com.br/ws/'+cep+'/json/');
    const d=await r.json();
    if(!d.erro){
      document.getElementById('endereco').value=d.logradouro||'';
      document.getElementById('bairro').value=d.bairro||'';
      document.getElementById('cidade').value=d.localidade||'';
      document.getElementById('estado').value=d.uf||'';
      if(d.logradouro)document.getElementById('numero').focus();
    }
  }catch(e){}
}

/* CARREGAR CARRINHO */
function loadCart(){
  cart=JSON.parse(localStorage.getItem('jp_carrinho')||'[]');
  if(!cart.length){location.href='index.html';return}
  const container=document.getElementById('itemsList');
  let total=0;
  container.innerHTML=cart.map(x=>{total+=x.preco*x.qty;return'<div class="item"><img src="'+x.imagem+'" onerror="this.src='https://via.placeholder.com/60?text=JP'"><div class="info"><div class="nome">'+x.nome+'</div><div class="preco">'+fmt(x.preco)+' <span style="color:var(--muted);font-weight:400">x '+x.qty+'</span></div></div></div>'}).join('');
  document.getElementById('totalValor').textContent=fmt(total);
}

/* CARREGAR ENDEREÇO SALVO */
function loadSavedAddress(){
  const saved=JSON.parse(localStorage.getItem('jp_endereco')||'{}');
  if(saved.nome)document.getElementById('nome').value=saved.nome;
  if(saved.cpf)document.getElementById('cpf').value=saved.cpf;
  if(saved.telefone)document.getElementById('telefone').value=saved.telefone;
  if(saved.email)document.getElementById('email').value=saved.email;
  if(saved.cep)document.getElementById('cep').value=saved.cep;
  if(saved.endereco)document.getElementById('endereco').value=saved.endereco;
  if(saved.numero)document.getElementById('numero').value=saved.numero;
  if(saved.complemento)document.getElementById('complemento').value=saved.complemento;
  if(saved.bairro)document.getElementById('bairro').value=saved.bairro;
  if(saved.cidade)document.getElementById('cidade').value=saved.cidade;
  if(saved.estado)document.getElementById('estado').value=saved.estado;
}

/* SALVAR ENDEREÇO */
function saveAddress(){
  const data={
    nome:document.getElementById('nome').value.trim(),
    cpf:document.getElementById('cpf').value.trim(),
    telefone:document.getElementById('telefone').value.trim(),
    email:document.getElementById('email').value.trim(),
    cep:document.getElementById('cep').value.trim(),
    endereco:document.getElementById('endereco').value.trim(),
    numero:document.getElementById('numero').value.trim(),
    complemento:document.getElementById('complemento').value.trim(),
    bairro:document.getElementById('bairro').value.trim(),
    cidade:document.getElementById('cidade').value.trim(),
    estado:document.getElementById('estado').value.trim()
  };
  localStorage.setItem('jp_endereco',JSON.stringify(data));
}

/* VALIDAR */
function validar(){
  const campos=['nome','cpf','telefone','cep','endereco','numero','bairro','cidade','estado'];
  for(const c of campos){
    const v=document.getElementById(c).value.trim();
    if(!v){document.getElementById(c).focus();return false}
  }
  const cpf=document.getElementById('cpf').value.replace(/\D/g,'');
  if(cpf.length!==11){toast('CPF inválido',true);return false}
  return true;
}

/* FINALIZAR */
async function finalizarCompra(){
  hideErro();
  if(!validar())return;
  saveAddress();

  const btn=document.getElementById('btnPagar');
  btn.disabled=true;
  btn.textContent='Processando...';

  const cliente={
    nome:document.getElementById('nome').value.trim(),
    cpf:document.getElementById('cpf').value.trim(),
    telefone:document.getElementById('telefone').value.trim(),
    email:document.getElementById('email').value.trim(),
    cep:document.getElementById('cep').value.trim(),
    endereco:document.getElementById('endereco').value.trim(),
    numero:document.getElementById('numero').value.trim(),
    complemento:document.getElementById('complemento').value.trim(),
    bairro:document.getElementById('bairro').value.trim(),
    cidade:document.getElementById('cidade').value.trim(),
    estado:document.getElementById('estado').value.trim()
  };

  const items=cart.map(x=>({id:x.id,nome:x.nome,preco:x.preco,qty:x.qty,imagem:x.imagem}));

  try{
    const res=await fetch(API_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({items:items,cliente:cliente})
    });
    const data=await res.json();
    if(!res.ok||data.error){
      showErro(data.error||'Erro ao criar pagamento. Tente novamente.');
      btn.disabled=false;
      btn.textContent='PAGAR COM PIX →';
      return;
    }
    // Limpa carrinho e redireciona
    localStorage.removeItem('jp_carrinho');
    location.href=data.init_point;
  }catch(e){
    showErro('Erro de conexão. Verifique sua internet.');
    btn.disabled=false;
    btn.textContent='PAGAR COM PIX →';
  }
}

/* INIT */
loadCart();
loadSavedAddress();
document.getElementById('loadingScreen').classList.add('hide');
</script>
</body>
</html>
