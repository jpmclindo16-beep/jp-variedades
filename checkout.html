<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0a">
<title>Finalizar compra - JP Shoppew</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#0a0a0a;
  color:#fff;
  min-height:100vh;
}

.header{
  background:#151515;
  border-bottom:1px solid #292929;
  padding:15px;
  display:flex;
  align-items:center;
  gap:12px;
}

.voltar{
  color:#fff;
  text-decoration:none;
  font-size:25px;
}

.logo{
  font-weight:800;
  font-size:18px;
}

.container{
  max-width:600px;
  margin:auto;
  padding:20px 16px 50px;
}

h1{
  font-size:23px;
  margin-bottom:18px;
}

.card{
  background:#171717;
  border:1px solid #292929;
  border-radius:15px;
  padding:16px;
  margin-bottom:15px;
}

.produto{
  display:flex;
  gap:14px;
  align-items:center;
}

.produto img{
  width:90px;
  height:90px;
  border-radius:12px;
  object-fit:cover;
  background:#292929;
}

.nome{
  font-size:15px;
  font-weight:700;
  line-height:1.35;
}

.preco{
  color:#00e676;
  font-size:22px;
  font-weight:800;
  margin-top:8px;
}

label{
  display:block;
  font-size:13px;
  color:#aaa;
  margin:13px 0 6px;
}

input{
  width:100%;
  padding:13px;
  border-radius:10px;
  border:1px solid #333;
  background:#0f0f0f;
  color:#fff;
  outline:none;
  font-size:14px;
}

input:focus{
  border-color:#00e676;
}

button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:15px;
  background:#00e676;
  color:#000;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  margin-top:18px;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.info{
  text-align:center;
  color:#999;
  font-size:12px;
  margin-top:15px;
  line-height:1.5;
}

.loading{
  text-align:center;
  padding:40px 10px;
  color:#aaa;
}

.erro{
  background:#351616;
  border:1px solid #722;
  color:#ff8a8a;
  padding:13px;
  border-radius:10px;
  margin-bottom:15px;
  display:none;
}

.resumo{
  display:flex;
  justify-content:space-between;
  margin-top:15px;
  padding-top:15px;
  border-top:1px solid #292929;
}

.total{
  color:#00e676;
  font-weight:800;
  font-size:20px;
}
</style>
</head>

<body>

<div class="header">
  <a href="index.html" class="voltar">←</a>
  <div class="logo">JP Shoppew ✓</div>
</div>

<div class="container">

  <h1>🛒 Finalizar compra</h1>

  <div id="erro" class="erro"></div>

  <div id="produtoBox" class="card">
    <div class="loading">Carregando produto...</div>
  </div>

  <div class="card">

    <h2 style="font-size:17px;margin-bottom:5px;">
      📦 Dados para entrega
    </h2>

    <p style="font-size:12px;color:#999;">
      Informe corretamente os dados para receber seu pedido.
    </p>

    <label>Nome completo</label>
    <input id="nome" type="text" placeholder="Seu nome completo">

    <label>CPF</label>
    <input id="cpf" type="text" inputmode="numeric" placeholder="000.000.000-00">

    <label>Telefone / WhatsApp</label>
    <input id="telefone" type="tel" placeholder="(00) 00000-0000">

    <label>CEP</label>
    <input id="cep" type="text" inputmode="numeric" placeholder="00000-000">

    <label>Endereço</label>
    <input id="endereco" type="text" placeholder="Rua, avenida...">

    <label>Número</label>
    <input id="numero" type="text" placeholder="Número">

    <label>Complemento</label>
    <input id="complemento" type="text" placeholder="Apartamento, casa...">

    <label>Bairro</label>
    <input id="bairro" type="text" placeholder="Bairro">

    <label>Cidade</label>
    <input id="cidade" type="text" placeholder="Cidade">

    <label>Estado</label>
    <input id="estado" type="text" maxlength="2" placeholder="UF">

    <div class="resumo">
      <span>Total</span>
      <span class="total" id="total">R$ 0,00</span>
    </div>

    <button id="comprar" onclick="comprar()">
      💳 PAGAR COM MERCADO PAGO
    </button>

    <div class="info">
      🔒 Pagamento processado pelo Mercado Pago.<br>
      Seus dados são utilizados para processar e entregar o pedido.<br>
      <a href="politica-de-troca.html" style="color:inherit;text-decoration:underline">Política de Troca e Devolução</a>
    </div>

  </div>

</div>

<script>

const SUPABASE_URL =
'https://ocheynyjboagfybazcsi.supabase.co';

const SUPABASE_KEY =
'sb_publishable_kL_nA7Fv-uHbC5mx8Hqm6A_XluBgT29';

let produto = null;
let itensCarrinho = null;

function mostrarErro(msg){
  const box=document.getElementById('erro');
  box.textContent=msg;
  box.style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});
}

function dinheiro(valor){
  return 'R$ '+Number(valor).toFixed(2).replace('.',',');
}

function preencherSalvos(){
  try{
    const salvo=JSON.parse(localStorage.getItem('jp_endereco')||'null');
    if(!salvo) return;
    ['nome','cpf','telefone','cep','endereco','numero','complemento','bairro','cidade','estado'].forEach(function(id){
      if(salvo[id]) document.getElementById(id).value=salvo[id];
    });
  }catch(e){}
}

function getCart(){try{return JSON.parse(localStorage.getItem('jp_cart')||'[]')}catch(e){return[]}}

async function carregarProduto(){

  const params=new URLSearchParams(location.search);
  const modoCarrinho=params.get('cart')==='1';

  if(modoCarrinho){
    await carregarCarrinho();
    return;
  }

  try{

    const id=params.get('id');

    if(!id){
      throw new Error('Produto não informado.');
    }

    const resposta=await fetch(
      SUPABASE_URL+
      '/rest/v1/produtos?id=eq.'+
      encodeURIComponent(id)+
      '&ativo=eq.true&limit=1',
      {
        headers:{
          'apikey':SUPABASE_KEY,
          'Authorization':'Bearer '+SUPABASE_KEY
        }
      }
    );

    if(!resposta.ok){
      throw new Error('Não foi possível carregar o produto.');
    }

    const dados=await resposta.json();

    if(!dados.length){
      throw new Error('Produto não encontrado.');
    }

    produto=dados[0];

    if(produto.tipo &&
       produto.tipo.toLowerCase()!=='dropshipping'){
      throw new Error('Este produto não é de dropshipping.');
    }

    const tamanhoEscolhido=params.get('tamanho')||'';

    const preco=Number(produto.preco_atual||0);

    document.getElementById('produtoBox').innerHTML=`

      <div class="produto">

        <img
          src="${produto.imagem_url || 'https://via.placeholder.com/300'}"
          onerror="this.src='https://via.placeholder.com/300'
        ">

        <div>

          <div class="nome">
            ${produto.nome || 'Produto'}${tamanhoEscolhido?(' - Tam. '+tamanhoEscolhido):''}
          </div>

          <div class="preco">
            ${dinheiro(preco)}
          </div>

        </div>

      </div>
    `;

    if(tamanhoEscolhido){
      window.tamanhoEscolhidoAtual=tamanhoEscolhido;
    }

    document.getElementById('total').textContent=dinheiro(preco);

  }catch(e){

    document.getElementById('produtoBox').innerHTML=
      '<div class="loading">Não foi possível carregar o produto.</div>';

    mostrarErro(e.message);

  }

}

async function carregarCarrinho(){
  try{
    const cart=getCart();
    if(!cart.length){
      throw new Error('Seu carrinho está vazio.');
    }

    itensCarrinho=cart;

    const total=cart.reduce(function(a,i){return a+(i.preco*i.qty)},0);

    document.getElementById('produtoBox').innerHTML=cart.map(function(i){
      return `<div class="produto" style="margin-bottom:12px">
        <img src="${i.imagem||'https://via.placeholder.com/300'}" onerror="this.src='https://via.placeholder.com/300'">
        <div>
          <div class="nome">${i.nome} <span style="color:#999;font-weight:400">x${i.qty}</span></div>
          <div class="preco">${dinheiro(i.preco*i.qty)}</div>
        </div>
      </div>`;
    }).join('<hr style="border-color:#292929;margin:12px 0">');

    document.getElementById('total').textContent=dinheiro(total);

  }catch(e){
    document.getElementById('produtoBox').innerHTML=
      '<div class="loading">Não foi possível carregar o carrinho.</div>';
    mostrarErro(e.message);
  }
}

function validar(){

  const campos=[
    ['nome','Nome completo'],
    ['cpf','CPF'],
    ['telefone','Telefone'],
    ['cep','CEP'],
    ['endereco','Endereço'],
    ['numero','Número'],
    ['bairro','Bairro'],
    ['cidade','Cidade'],
    ['estado','Estado']
  ];

  for(const [id,nome] of campos){

    const valor=document.getElementById(id).value.trim();

    if(!valor){

      document.getElementById(id).focus();

      mostrarErro('Preencha o campo: '+nome);

      return false;
    }

  }

  return true;
}

async function comprar(){

  if(!produto && !itensCarrinho){
    mostrarErro('Produto ainda não carregado.');
    return;
  }

  if(!validar()) return;

  const botao=document.getElementById('comprar');

  botao.disabled=true;
  botao.textContent='⏳ Criando pagamento...';

  const cliente={

    nome:document.getElementById('nome').value.trim(),

    cpf:document.getElementById('cpf').value.replace(/\D/g,''),

    telefone:document.getElementById('telefone').value.trim(),

    cep:document.getElementById('cep').value.trim(),

    endereco:document.getElementById('endereco').value.trim(),

    numero:document.getElementById('numero').value.trim(),

    complemento:document.getElementById('complemento').value.trim(),

    bairro:document.getElementById('bairro').value.trim(),

    cidade:document.getElementById('cidade').value.trim(),

    estado:document.getElementById('estado').value.trim().toUpperCase()

  };

  try{

    localStorage.setItem('jp_endereco', JSON.stringify(cliente));

    const corpo=itensCarrinho
      ? { itens: itensCarrinho.map(function(i){return {produto_id:(i.produtoId||i.id), quantidade:i.qty, tamanho:i.tamanho||null}}), cliente:cliente }
      : { produto_id:produto.id, cliente:cliente, tamanho:(window.tamanhoEscolhidoAtual||null) };

    const resposta=await fetch(
      '/api/criar-pagamento',
      {
        method:'POST',

        headers:{
          'Content-Type':'application/json'
        },

        body:JSON.stringify(corpo)

      }
    );

    const resultado=await resposta.json();

    if(!resposta.ok){

      throw new Error(
        resultado.error ||
        'Não foi possível criar o pagamento.'
      );

    }

    if(itensCarrinho){
      localStorage.removeItem('jp_cart');
    }

    if(resultado.init_point){

      window.location.href=resultado.init_point;

      return;

    }

    if(resultado.sandbox_init_point){

      window.location.href=resultado.sandbox_init_point;

      return;

    }

    throw new Error('Link do Mercado Pago não recebido.');

  }catch(e){

    mostrarErro(e.message);

    botao.disabled=false;
    botao.textContent='💳 PAGAR COM MERCADO PAGO';

  }

}

preencherSalvos();
carregarProduto();

</script>

</body>
</html>
