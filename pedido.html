<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0a0a"><title>Pedido - JP Variedades</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0a0a0a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}.box{width:min(100%,430px);background:#171717;border:1px solid #292929;border-radius:18px;padding:28px;text-align:center}.icon{font-size:52px;margin-bottom:12px}h1{font-size:23px;margin:0 0 8px}p{color:#aaa;line-height:1.5}a{display:block;text-decoration:none;background:#00e676;color:#000;font-weight:800;border-radius:10px;padding:13px;margin-top:20px}</style></head>
<body><div class="box"><div class="icon" id="icon">⏳</div><h1 id="title">Processando pedido</h1><p id="text">Aguarde enquanto confirmamos o status do pagamento.</p><a href="index.html">Voltar para a loja</a></div>
<script>
const s=new URLSearchParams(location.search).get('status');
if(s==='sucesso'){icon.textContent='✅';title.textContent='Pagamento aprovado!';text.textContent='Seu pagamento foi aprovado. O pedido será processado.'}
else if(s==='pendente'){icon.textContent='⏳';title.textContent='Pagamento pendente';text.textContent='O Mercado Pago ainda está processando o pagamento.'}
else if(s==='erro'){icon.textContent='⚠️';title.textContent='Pagamento não concluído';text.textContent='Não foi possível concluir o pagamento. Você pode voltar à loja e tentar novamente.'}
</script></body></html>
