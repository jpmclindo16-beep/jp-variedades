<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0a">
<title>Pedido - JP Variedades</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0a0a0a;color:#fff;min-height:100vh}
.header{background:#151515;border-bottom:1px solid #292929;padding:15px;display:flex;align-items:center;gap:12px}
.voltar{color:#fff;text-decoration:none;font-size:25px}
.logo{font-weight:800;font-size:18px}
.container{max-width:600px;margin:auto;padding:20px 16px 50px}

.status-box{text-align:center;padding:30px 20px;margin-bottom:20px}
.status-icon{font-size:60px;margin-bottom:15px}
.status-title{font-size:22px;font-weight:800;margin-bottom:8px}
.status-text{font-size:14px;color:#aaa;line-height:1.5}

.aprovado .status-icon{color:#00e676}
.aprovado .status-title{color:#00e676}
.pendente .status-icon{color:#ffc107}
.pendente .status-title{color:#ffc107}
.erro .status-icon{color:#ff5252}
.erro .status-title{color:#ff5252}

.card{background:#171717;border:1px solid #292929;border-radius:15px;padding:16px;margin-bottom:15px}
.card h3{font-size:15px;margin-bottom:12px;color:#aaa}

.produto{display:flex;gap:14px;align-items:center}
.produto img{width:80px;height:80px;border-radius:12px;object-fit:cover;background:#292929}
.produto .nome{font-size:15px;font-weight:700;line-height:1.35}
.produto .preco{color:#00e676;font-size:20px;font-weight:800;margin-top:6px}

.info-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #292929;font-size:14px}
.info-row:last-child{border-bottom:none}
.info-row span:first-child{color:#aaa}
.info-row span:last-child{font-weight:600}

.btn{width:100%;border:0;border-radius:12px;padding:15px;background:#00e676;color:#000;font-size:16px;font-weight:800;cursor:pointer;margin-top:10px;text-align:center;text-decoration:none;display:inline-block}
.btn-outline{background:transparent;border:1px solid #00e676;color:#00e676}

.loading{text-align:center;padding:40px;color:#aaa}
.erro-box{background:#351616;border:1px solid #722;color:#ff8a8a;padding:13px;border-radius:10px;margin-bottom:15px;text-align:center}

.whats-btn{width:100%;border:0;border-radius:12px;padding:15px;background:#25d366;color:#fff;font-size:16px;font-weight:800;cursor:pointer;margin-top:10px;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
</style>
</head>
<body>

<div class="header">
  <a href="index.html" class="voltar">←</a>
  <div class="logo">JP_variedades ✓</div>
</div>

<div class="container">

  <div id="statusBox" class="status-box">
    <div class="loading">Carregando pedido...</div>
  </div>

  <div id="produtoBox" style="display:none">
    <div class="card">
      <h3>📦 Produto comprado</h3>
      <div id="produtoInfo"></div>
    </div>

    <div class="card">
      <h3>🚚 Informações de entrega</h3>
      <div id="entregaInfo"></div>
    </div>

    <div class="card">
      <h3>💳 Pagamento</h3>
      <div id="pagamentoInfo"></div>
    </div>

    <a href="index.html" class="btn">🏠 Voltar à loja</a>
    <a href="https://chat.whatsapp.com/CNv0OTwmJkO0TBJZyQTG3r" target="_blank" class="whats-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      Falar no WhatsApp
    </a>
  </div>

</div>

<script>
const SUPABASE_URL='https://ocheynyjboagfybazcsi.supabase.co';
const SUPABASE_KEY='sb_publishable_kL_nA7Fv-uHbC5mx8Hqm6A_XluBgT29';

function getParam(n){return new URLSearchParams(location.search).get(n)}

function fmt(p){return'R$ '+Number(p).toFixed(2).replace('.',',')}

function showStatus(tipo,titulo,texto){
  const box=document.getElementById('statusBox');
  box.className='status-box '+tipo;
  let icone='';
  if(tipo==='aprovado') icone='✅';
  else if(tipo==='pendente') icone='⏳';
  else if(tipo==='erro') icone='❌';
  else icone='📋';
  box.innerHTML=`<div class="status-icon">${icone}</div><div class="status-title">${titulo}</div><div class="status-text">${texto}</div>`;
}

async function carregarPedido(){
  const status=getParam('status')||getParam('collection_status')||'';
  const extRef=getParam('external_reference')||'';
  const paymentId=getParam('payment_id')||getParam('collection_id')||'';

  // Extrai produto_id do external_reference (formato: JP-{id}-{timestamp})
  let produtoId='';
  if(extRef && extRef.startsWith('JP-')){
    const partes=extRef.split('-');
    if(partes.length>=3) produtoId=partes[1];
  }

  // Define status visual
  if(status==='approved'||status==='sucesso'){
    showStatus('aprovado','Pagamento aprovado!','Seu pedido foi confirmado e será preparado para envio. Você receberá atualizações pelo WhatsApp.');
  }else if(status==='pending'||status==='in_process'){
    showStatus('pendente','Aguardando pagamento','Seu pedido foi reservado. Assim que o pagamento for confirmado, preparamos o envio.');
  }else if(status==='failure'||status==='rejected'||status==='erro'){
    showStatus('erro','Pagamento não aprovado','Não se preocupe! Você pode tentar novamente ou escolher outra forma de pagamento.');
  }else{
    showStatus('','Obrigado pela compra!','Seu pedido foi registrado. Em breve você receberá atualizações sobre o status.');
  }

  if(!produtoId){
    document.getElementById('produtoBox').style.display='block';
    document.getElementById('produtoInfo').innerHTML='<div style="color:#aaa;font-size:14px">Não foi possível carregar os detalhes do produto.</div>';
    return;
  }

  try{
    const res=await fetch(SUPABASE_URL+'/rest/v1/produtos?id=eq.'+encodeURIComponent(produtoId)+'&limit=1',{
      headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}
    });
    const dados=await res.json();

    document.getElementById('produtoBox').style.display='block';

    if(dados && dados.length>0){
      const p=dados[0];
      document.getElementById('produtoInfo').innerHTML=`
        <div class="produto">
          <img src="${p.imagem_url||'https://via.placeholder.com/300'}" onerror="this.src='https://via.placeholder.com/300'">
          <div>
            <div class="nome">${p.nome||'Produto'}</div>
            <div class="preco">${fmt(Number(p.preco_atual||0))}</div>
          </div>
        </div>
      `;
    }else{
      document.getElementById('produtoInfo').innerHTML='<div style="color:#aaa;font-size:14px">Produto não encontrado.</div>';
    }

    // Info de entrega
    document.getElementById('entregaInfo').innerHTML=`
      <div class="info-row"><span>Status do pedido</span><span style="color:#00e676">${status==='approved'||status==='sucesso'?'Pago ✅':(status==='pending'?'Aguardando ⏳':'Processando')}</span></div>
      <div class="info-row"><span>Prazo de entrega</span><span>7 a 15 dias úteis</span></div>
      <div class="info-row"><span>Código do pedido</span><span style="font-size:12px">${extRef||paymentId||'---'}</span></div>
    `;

    // Info de pagamento
    document.getElementById('pagamentoInfo').innerHTML=`
      <div class="info-row"><span>Forma de pagamento</span><span>Pix / Mercado Pago</span></div>
      <div class="info-row"><span>ID do pagamento</span><span style="font-size:12px">${paymentId||'---'}</span></div>
      <div class="info-row"><span>Data</span><span>${new Date().toLocaleDateString('pt-BR')}</span></div>
    `;

  }catch(e){
    document.getElementById('produtoBox').style.display='block';
    document.getElementById('produtoInfo').innerHTML='<div style="color:#aaa;font-size:14px">Erro ao carregar detalhes.</div>';
  }
}

carregarPedido();
</script>

</body>
</html>
