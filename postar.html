<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Postar Oferta</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0d1117; color: #e6edf3; margin: 0; padding: 20px; }
  h1 { font-size: 20px; margin-bottom: 20px; }
  label { display: block; margin-top: 14px; margin-bottom: 4px; font-size: 14px; color: #9198a1; }
  input, textarea {
    width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #30363d;
    background: #161b22; color: #e6edf3; box-sizing: border-box; font-size: 15px; font-family: inherit;
  }
  textarea { resize: vertical; min-height: 70px; }
  button {
    margin-top: 20px; width: 100%; padding: 14px; border-radius: 8px; border: none;
    background: #2ea043; color: white; font-size: 16px; font-weight: bold; cursor: pointer;
  }
  button:disabled { background: #444; cursor: not-allowed; }
  #resultado { margin-top: 16px; padding: 12px; border-radius: 8px; display: none; font-size: 14px; }
  .sucesso { background: #0d3320; color: #4dd47e; display: block !important; }
  .erro { background: #3d1116; color: #ff7b72; display: block !important; }
  .hint { font-size: 12px; color: #6e7681; margin-top: 4px; }
  .loading { 
    display: inline-block; width: 16px; height: 16px; 
    border: 2px solid #fff; border-top-color: transparent; 
    border-radius: 50%; animation: spin 0.8s linear infinite; 
    margin-right: 8px; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<h1>🔥 Postar oferta (Telegram, Facebook, Instagram e Threads)</h1>

<form id="form-oferta">
  <label>Legenda *</label>
  <textarea id="legenda" required placeholder="Escreva a legenda do post..."></textarea>

  <label>Preço atual (R$) *</label>
  <input type="number" step="0.01" id="precoAtual" required>

  <label>Preço original (R$) — opcional, deixa em branco se não tiver desconto</label>
  <input type="number" step="0.01" id="precoOriginal">

  <label>Link de afiliado *</label>
  <input type="url" id="link" required>

  <label>Imagem 1 — opcional (obrigatória p/ Instagram e Threads)</label>
  <input type="url" id="imagem1" placeholder="https://...">

  <label>Imagem 2 — opcional</label>
  <input type="url" id="imagem2" placeholder="https://...">

  <label>Imagem 3 — opcional</label>
  <input type="url" id="imagem3" placeholder="https://...">

  <button type="submit" id="btn-postar">Postar</button>
</form>

<div id="resultado"></div>

<script>
document.getElementById('form-oferta').addEventListener('submit', async function(e) {
  e.preventDefault();
  
  const btn = document.getElementById('btn-postar');
  const resultado = document.getElementById('resultado');
  
  // Desabilita o botão e mostra loading
  btn.disabled = true;
  btn.innerHTML = '<span class="loading"></span>Postando...';
  resultado.style.display = 'none';
  
  // Coleta os dados do formulário
  const legenda = document.getElementById('legenda').value.trim();
  const precoAtual = document.getElementById('precoAtual').value;
  const precoOriginal = document.getElementById('precoOriginal').value;
  const link = document.getElementById('link').value.trim();
  
  // Coleta imagens (apenas as preenchidas)
  const imagens = [];
  const imagem1 = document.getElementById('imagem1').value.trim();
  const imagem2 = document.getElementById('imagem2').value.trim();
  const imagem3 = document.getElementById('imagem3').value.trim();
  
  if (imagem1) imagens.push(imagem1);
  if (imagem2) imagens.push(imagem2);
  if (imagem3) imagens.push(imagem3);
  
  // Monta o payload com os nomes corretos
  const payload = {
    caption: legenda,
    precoAtual: precoAtual,
    precoOriginal: precoOriginal || "",
    linkAfiliado: link,
    imagens: imagens
  };
  
  console.log('Enviando payload:', payload);
  
  try {
    const response = await fetch('/api/postar-manual', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(payload)
    });
    
    const data = await response.json();
    
    if (data.success) {
      resultado.className = 'sucesso';

      const resultados = data.resultados || {};
      const linhas = [];

      ['telegram', 'facebook', 'instagram'].forEach(function(rede) {
        const r = resultados[rede];
        if (!r) return;
        const nome = rede.charAt(0).toUpperCase() + rede.slice(1);
        if (r.success) {
          linhas.push(`✅ ${nome}: publicado`);
        } else if (r.skipped) {
          linhas.push(`⚪ ${nome}: pulado (${r.error})`);
        } else {
          linhas.push(`❌ ${nome}: ${r.error || 'falhou'}`);
        }
      });

      resultado.innerHTML = linhas.length
        ? linhas.join('<br>')
        : `✅ ${data.message || 'Postagem realizada com sucesso!'}`;

      // Limpa o formulário
      document.getElementById('form-oferta').reset();
    } else {
      resultado.className = 'erro';

      const resultados = data.resultados || {};
      const linhas = [`❌ Erro: ${data.error || 'Erro desconhecido'}`];

      ['telegram', 'facebook', 'instagram'].forEach(function(rede) {
        const r = resultados[rede];
        if (!r) return;
        const nome = rede.charAt(0).toUpperCase() + rede.slice(1);
        linhas.push(`${r.success ? '✅' : '❌'} ${nome}: ${r.success ? 'publicado' : (r.error || 'falhou')}`);
      });

      resultado.innerHTML = linhas.join('<br>');
    }
  } catch (err) {
    resultado.className = 'erro';
    resultado.innerHTML = `❌ Erro de conexão: ${err.message}`;
  } finally {
    // Reabilita o botão
    btn.disabled = false;
    btn.innerHTML = 'Postar';
  }
});
</script>

</body>
</html>
