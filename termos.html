<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Postar Oferta</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0d1117; color: #e6edf3; margin: 0; padding: 20px; }
  h1 { font-size: 20px; margin-bottom: 20px; }
  label { display: block; margin-top: 14px; margin-bottom: 4px; font-size: 14px; color: #9198a1; }
  input, textarea {
    width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #30363d;
    background: #161b22; color: #e6edf3; box-sizing: border-box; font-size: 15px; font-family: inherit;
  }
  textarea { resize: vertical; min-height: 70px; }
  button {
    margin-top: 20px; width: 100%; padding: 14px; border-radius: 8px; border: none;
    background: #2ea043; color: white; font-size: 16px; font-weight: bold;
  }
  button:disabled { background: #444; }
  #resultado { margin-top: 16px; padding: 12px; border-radius: 8px; display: none; font-size: 14px; }
  .sucesso { background: #0d3320; color: #4dd47e; display: block !important; }
  .erro { background: #3d1116; color: #ff7b72; display: block !important; }
  .hint { font-size: 12px; color: #6e7681; margin-top: 4px; }
</style>
</head>
<body>

<h1>🔥 Postar oferta (Telegram, Facebook, Instagram e Threads)</h1>

<form id="form-oferta">
  <label>Legenda *</label>
  <textarea id="legenda" required placeholder="Escreva a legenda do post..."></textarea>

  <label>Preço atual (R$) *</label>
  <input type="number" step="0.01" id="precoAtual" required>

  <label>Preço original (R$) — opcional, deixa em branco se não tiver desconto</label>
  <input type="number" step="0.01" id="precoOriginal">

  <label>Link de afiliado *</label>
  <input type="url" id="link" required>

  <label>Imagem 1 — opcional (obrigatória p/ Instagram e Threads)</label>
  <input type="url" id="imagem1">

  <label>Imagem 2 — opcional</label>
  <input type="url" id="imagem2">

  <label>Imagem 3 — opcional</label>
  <input type="url" id="imagem3">
  <div class="hint">Com 2 ou 3 imagens, o post vira um carrossel/álbum em todas as plataformas.</div>

  <button type="submit" id="botao-enviar">Postar</button>
</form>

<div id="resultado"></div>

<script>
document.getElementById('form-oferta').addEventListener('submit', async (e) => {
  e.preventDefault();

  const botao = document.getElementById('botao-enviar');
  const resultado = document.getElementById('resultado');
  botao.disabled = true;
  botao.textContent = 'Enviando...';
  resultado.className = '';
  resultado.style.display = 'none';

  const imagens = [
    document.getElementById('imagem1').value,
    document.getElementById('imagem2').value,
    document.getElementById('imagem3').value,
  ].filter(Boolean);

  const dados = {
    legenda: document.getElementById('legenda').value,
    precoAtual: document.getElementById('precoAtual').value,
    precoOriginal: document.getElementById('precoOriginal').value || null,
    link: document.getElementById('link').value,
    imagens,
  };

  try {
    const resp = await fetch('/api/postar-manual', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(dados),
    });

    const json = await resp.json();

    if (json.ok) {
      let partes = [];
      if (json.telegram) partes.push('Telegram');
      if (json.facebook) partes.push('Facebook');
      if (json.instagram) partes.push('Instagram');
      if (json.threads) partes.push('Threads');

      let mensagem = partes.length > 0
        ? '✅ Postado em: ' + partes.join(', ') + '!'
        : '⚠️ Nenhuma plataforma recebeu a postagem.';

      if (!json.instagram && json.instagramMsg) mensagem += ' | Instagram: ' + json.instagramMsg;
      if (!json.threads && json.threadsMsg) mensagem += ' | Threads: ' + json.threadsMsg;

      resultado.textContent = mensagem;
      resultado.className = partes.length > 0 ? 'sucesso' : 'erro';
      document.getElementById('form-oferta').reset();
    } else {
      resultado.textContent = '❌ Erro: ' + (json.error || 'algo deu errado');
      resultado.className = 'erro';
    }
  } catch (err) {
    resultado.textContent = '❌ Erro de conexão: ' + err.message;
    resultado.className = 'erro';
  }

  botao.disabled = false;
  botao.textContent = 'Postar';
});
</script>

</body>
</html>
