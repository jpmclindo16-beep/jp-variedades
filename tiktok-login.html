<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conectar com TikTok</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: #0d1117;
      color: #e6edf3;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 32px 24px;
      text-align: center;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;
      box-shadow: 0 10px 35px rgba(0,0,0,.35);
    }

    .icone {
      font-size: 52px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 24px;
    }

    p {
      margin: 0;
      color: #9da7b3;
      line-height: 1.5;
      font-size: 15px;
    }

    .botao {
      display: block;
      width: 100%;
      margin-top: 28px;
      padding: 15px 20px;
      border: 0;
      border-radius: 10px;
      background: #ff0050;
      color: #fff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .botao:active {
      transform: scale(.98);
    }

    .aviso {
      margin-top: 18px;
      font-size: 12px;
      color: #6e7681;
    }

    #erro {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      background: #3d1116;
      color: #ff7b72;
      font-size: 13px;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="icone">🎵</div>

    <h1>Conectar com TikTok</h1>

    <p>
      Entre com sua conta do TikTok para autorizar
      o JP Ofertas Bot.
    </p>

    <a
      id="link-login"
      class="botao"
      href="#"
    >
      Entrar com TikTok
    </a>

    <div class="aviso">
      Você será direcionado para o TikTok para autorizar o acesso.
    </div>

    <div id="erro"></div>

  </div>

  <script>
    /*
     * ==========================================
     * CONFIGURAÇÃO DO TIKTOK
     * ==========================================
     */

    // SUA CLIENT KEY
    const CLIENT_KEY = 'awhix2ag9yx68zr1';

    // URL cadastrada no TikTok Developer
    const REDIRECT_URI =
      'https://jp-variedades.vercel.app/tiktok-callback.html';


    /*
     * ==========================================
     * GERAR STATE DE SEGURANÇA
     * ==========================================
     */

    let STATE;

    try {
      STATE = crypto.randomUUID();
    } catch (e) {
      STATE =
        Date.now().toString(36) +
        Math.random().toString(36).substring(2);
    }


    /*
     * ==========================================
     * PERMISSÃO INICIAL
     * ==========================================
     *
     * Primeiro vamos testar somente o Login Kit
     * básico. Depois que o login funcionar,
     * configuramos a publicação.
     */

    const SCOPE = 'user.info.basic';


    /*
     * ==========================================
     * MONTAR URL DO TIKTOK
     * ==========================================
     */

    const params = new URLSearchParams();

    params.set('client_key', CLIENT_KEY);
    params.set('response_type', 'code');
    params.set('scope', SCOPE);
    params.set('redirect_uri', REDIRECT_URI);
    params.set('state', STATE);

    const LOGIN_URL =
      'https://www.tiktok.com/v2/auth/authorize/?' +
      params.toString();


    /*
     * ==========================================
     * COLOCAR LINK NO BOTÃO
     * ==========================================
     */

    const botao =
      document.getElementById('link-login');

    botao.href = LOGIN_URL;


    /*
     * ==========================================
     * VERIFICAÇÃO BÁSICA
     * ==========================================
     */

    const erro =
      document.getElementById('erro');

    if (!CLIENT_KEY || CLIENT_KEY === 'SEU_CLIENT_KEY_AQUI') {

      erro.style.display = 'block';

      erro.textContent =
        '❌ Client Key não configurada.';
      
      botao.removeAttribute('href');

    }


    /*
     * ==========================================
     * CLIQUE
     * ==========================================
     */

    botao.addEventListener('click', function(event) {

      if (!CLIENT_KEY) {
        event.preventDefault();

        erro.style.display = 'block';

        erro.textContent =
          '❌ Não foi possível iniciar o login.';
      }

    });
  </script>

</body>
</html>
