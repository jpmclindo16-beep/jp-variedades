<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conectar com TikTok</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    font-family: system-ui, sans-serif;
    background: #0d1117;
    color: #e6edf3;
    margin: 0;
    min-height: 100vh;
    padding: 40px 20px;
    text-align: center;
  }

  .container {
    max-width: 420px;
    margin: 80px auto 0;
  }

  h1 {
    font-size: 24px;
    margin-bottom: 12px;
  }

  p {
    color: #aab4c0;
    line-height: 1.5;
  }

  a.botao {
    display: inline-block;
    margin-top: 24px;
    padding: 14px 28px;
    background: #ff0050;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
  }

  a.botao:hover {
    opacity: 0.9;
  }
</style>
</head>

<body>

<div class="container">

  <h1>🎵 Conectar com TikTok</h1>

  <p>
    Clique abaixo para entrar com sua conta do TikTok
    e autorizar o JP Ofertas Bot.
  </p>

  <a class="botao" id="link-login" href="#">
    Entrar com TikTok
  </a>

</div>

<script>
  // Client Key do aplicativo TikTok
  const CLIENT_KEY = 'awhix2ag9yx68zr1';

  // Deve ser EXATAMENTE igual ao cadastrado no TikTok Developer
  const REDIRECT_URI =
    'https://jp-variedades.vercel.app/tiktok-callback.html';

  // Estado temporário para a solicitação OAuth
  const STATE = crypto.randomUUID();

  // Primeiro vamos testar somente a permissão básica
  const params = new URLSearchParams({
    client_key: CLIENT_KEY,
    response_type: 'code',
    scope: 'user.info.basic',
    redirect_uri: REDIRECT_URI,
    state: STATE
  });

  const loginUrl =
    'https://www.tiktok.com/v2/auth/authorize/?' +
    params.toString();

  document.getElementById('link-login').href = loginUrl;
</script>

</body>
</html>
