<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - JP Variedades</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a0a0b;
    color: #fff;
    min-height: 100vh;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 24px; }
  .card {
    background: #17171a;
    border: 1px solid #2a2a2e;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
  }
  label { display: block; font-size: 13px; color: #999; margin: 12px 0 6px; }
  label:first-child { margin-top: 0; }
  input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #333;
    background: #0a0a0b;
    color: #fff;
    font-size: 15px;
  }
  input:focus { outline: none; border-color: #ff4d8d; }
  button {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    background: #ff4d8d;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    margin-top: 16px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; }
  button.secondary { background: transparent; border: 1px solid #333; color: #ccc; margin-top: 8px; }
  .msg { font-size: 13px; margin-top: 10px; }
  .msg.error { color: #ff6b6b; }
  .msg.ok { color: #4ade80; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .top-bar button { width: auto; padding: 8px 14px; font-size: 13px; margin: 0; }
  .product {
    display: flex;
    gap: 12px;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #2a2a2e;
  }
  .product:last-child { border-bottom: none; }
  .product img { width: 48px; height: 48px; object-fit: cover; border-radius: 8px; background: #222; }
  .product .info { flex: 1; min-width: 0; }
  .product .name { font-size: 14px; font-weight: 500; }
  .product .price { font-size: 13px; color: #999; }
  .product .del { width: auto; background: transparent; border: 1px solid #442; color: #ff6b6b; padding: 6px 10px; font-size: 12px; margin: 0; }
  #app { display: none; }
  #login { display: block; }
</style>
</head>
<body>
<div class="wrap">

  <div id="login">
    <h1>Login — Admin JP Variedades</h1>
    <div class="card">
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username" placeholder="seu@email.com">
      <label for="senha">Senha</label>
      <input id="senha" type="password" autocomplete="current-password" placeholder="••••••••">
      <button id="btnLogin">Entrar</button>
      <div id="loginMsg" class="msg"></div>
    </div>
  </div>

  <div id="app">
    <div class="top-bar">
      <h1 style="margin:0">Produtos</h1>
      <button id="btnLogout">Sair</button>
    </div>

    <div class="card">
      <label for="nome">Nome do produto</label>
      <input id="nome" type="text" placeholder="Ex: Fone Bluetooth XYZ">
      <label for="preco">Preço (R$)</label>
      <input id="preco" type="number" step="0.01" placeholder="Ex: 49.90">
      <label for="imagem">URL da imagem</label>
      <input id="imagem" type="url" placeholder="https://...">
      <label for="link">Link de afiliado</label>
      <input id="link" type="url" placeholder="https://...">
      <button id="btnAdd">Adicionar produto</button>
      <div id="addMsg" class="msg"></div>
    </div>

    <div class="card">
      <h1 style="font-size:16px;margin:0 0 8px">Produtos cadastrados</h1>
      <div id="lista">Carregando...</div>
    </div>
  </div>

</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// --- CONFIGURAÇÃO ---
const SUPABASE_URL = 'https://ocheynyjboagfybazcsi.supabase.co';
const SUPABASE_KEY = 'sb_publishable_kL_nA7Fv-uHbC5mx8Hqm6A_XluBgT29';
// ---------------------

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const loginDiv = document.getElementById('login');
const appDiv = document.getElementById('app');
const loginMsg = document.getElementById('loginMsg');
const addMsg = document.getElementById('addMsg');
const lista = document.getElementById('lista');

function showApp() {
  loginDiv.style.display = 'none';
  appDiv.style.display = 'block';
  carregarProdutos();
}
function showLogin() {
  loginDiv.style.display = 'block';
  appDiv.style.display = 'none';
}

// Checa se já está logado
supabase.auth.getSession().then(({ data }) => {
  if (data.session) showApp(); else showLogin();
});

document.getElementById('btnLogin').addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim();
  const senha = document.getElementById('senha').value;
  loginMsg.textContent = '';
  loginMsg.className = 'msg';
  if (!email || !senha) {
    loginMsg.textContent = 'Preencha e-mail e senha.';
    loginMsg.className = 'msg error';
    return;
  }
  const { error } = await supabase.auth.signInWithPassword({ email, password: senha });
  if (error) {
    loginMsg.textContent = 'Erro: ' + error.message;
    loginMsg.className = 'msg error';
    return;
  }
  showApp();
});

document.getElementById('btnLogout').addEventListener('click', async () => {
  await supabase.auth.signOut();
  showLogin();
});

document.getElementById('btnAdd').addEventListener('click', async () => {
  const nome = document.getElementById('nome').value.trim();
  const preco = document.getElementById('preco').value;
  const imagem = document.getElementById('imagem').value.trim();
  const link = document.getElementById('link').value.trim();

  addMsg.textContent = '';
  addMsg.className = 'msg';

  if (!nome) {
    addMsg.textContent = 'O nome do produto é obrigatório.';
    addMsg.className = 'msg error';
    return;
  }

  const { error } = await supabase.from('produtos').insert({
    nome: nome,
    preco: preco ? parseFloat(preco) : null,
    imagem_url: imagem || null,
    link_afiliado: link || null
  });

  if (error) {
    addMsg.textContent = 'Erro ao salvar: ' + error.message;
    addMsg.className = 'msg error';
    return;
  }

  addMsg.textContent = 'Produto adicionado!';
  addMsg.className = 'msg ok';
  document.getElementById('nome').value = '';
  document.getElementById('preco').value = '';
  document.getElementById('imagem').value = '';
  document.getElementById('link').value = '';
  carregarProdutos();
});

async function carregarProdutos() {
  lista.textContent = 'Carregando...';
  const { data, error } = await supabase
    .from('produtos')
    .select('*')
    .order('id', { ascending: false });

  if (error) {
    lista.textContent = 'Erro ao carregar: ' + error.message;
    return;
  }

  if (!data || data.length === 0) {
    lista.textContent = 'Nenhum produto cadastrado ainda.';
    return;
  }

  lista.innerHTML = '';
  data.forEach(p => {
    const div = document.createElement('div');
    div.className = 'product';
    div.innerHTML = `
      <img src="${p.imagem_url || ''}" onerror="this.style.opacity=0">
      <div class="info">
        <div class="name">${p.nome || '(sem nome)'}</div>
        <div class="price">${p.preco != null ? 'R$ ' + Number(p.preco).toFixed(2) : ''}</div>
      </div>
      <button class="del" data-id="${p.id}">Excluir</button>
    `;
    lista.appendChild(div);
  });

  lista.querySelectorAll('.del').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Excluir este produto?')) return;
      const id = btn.getAttribute('data-id');
      const { error } = await supabase.from('produtos').delete().eq('id', id);
      if (error) { alert('Erro ao excluir: ' + error.message); return; }
      carregarProdutos();
    });
  });
}
</script>
</body>
</html>
