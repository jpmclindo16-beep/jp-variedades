<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - JP Variedades</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f0f23; color: #fff; min-height: 100vh; }

    .login-container {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    }
    .login-box {
      background: #1e1e3f; padding: 40px; border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5); width: 100%; max-width: 400px;
      text-align: center;
    }
    .login-box h1 { font-size: 28px; margin-bottom: 8px; color: #00d4aa; }
    .login-box p { color: #888; margin-bottom: 24px; }
    .login-box input {
      width: 100%; padding: 14px 16px; margin-bottom: 12px;
      border: 2px solid #333; border-radius: 10px; background: #151530;
      color: #fff; font-size: 16px; outline: none; transition: border-color 0.2s;
    }
    .login-box input:focus { border-color: #00d4aa; }
    .login-box button {
      width: 100%; padding: 14px; background: #00d4aa; color: #0f0f23;
      border: none; border-radius: 10px; font-size: 16px; font-weight: bold;
      cursor: pointer; transition: all 0.2s;
    }
    .login-box button:hover { background: #00b894; transform: translateY(-2px); }
    .erro { color: #e74c3c; margin-top: 12px; font-size: 14px; }

    .admin-container { display: none; }
    .topbar {
      background: #1a1a2e; padding: 16px 24px; display: flex;
      justify-content: space-between; align-items: center;
      border-bottom: 1px solid #333; flex-wrap: wrap; gap: 12px;
    }
    .topbar h2 { color: #00d4aa; font-size: 20px; }
    .topbar .actions { display: flex; gap: 12px; align-items: center; }
    .topbar button {
      padding: 10px 20px; border-radius: 8px; border: none;
      font-weight: bold; cursor: pointer; font-size: 14px;
    }
    .btn-novo { background: #00d4aa; color: #0f0f23; }
    .btn-novo:hover { background: #00b894; }
    .btn-sair { background: #e74c3c; color: #fff; }
    .btn-sair:hover { background: #c0392b; }

    .content { padding: 24px; max-width: 1400px; margin: 0 auto; }

    .stats {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px; margin-bottom: 24px;
    }
    .stat-card {
      background: #1e1e3f; padding: 20px; border-radius: 12px;
      border: 1px solid #333;
    }
    .stat-card h4 { color: #888; font-size: 13px; text-transform: uppercase; margin-bottom: 8px; }
    .stat-card .num { font-size: 32px; font-weight: bold; color: #00d4aa; }

    .produtos-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }
    .prod-card {
      background: #1e1e3f; border-radius: 12px; overflow: hidden;
      border: 1px solid #333; transition: all 0.2s;
    }
    .prod-card:hover { border-color: #00d4aa; transform: translateY(-2px); }
    .prod-card img { width: 100%; height: 180px; object-fit: cover; }
    .prod-info { padding: 16px; }
    .prod-info h3 { font-size: 16px; margin-bottom: 6px; color: #fff; }
    .prod-info .preco { color: #00d4aa; font-size: 20px; font-weight: bold; margin-bottom: 4px; }
    .prod-info .cat { color: #888; font-size: 13px; margin-bottom: 12px; }
    .prod-info .status {
      display: inline-block; padding: 4px 10px; border-radius: 20px;
      font-size: 12px; font-weight: bold; margin-bottom: 12px;
    }
    .status-ativo { background: #27ae6033; color: #27ae60; }
    .status-inativo { background: #e74c3c33; color: #e74c3c; }
    .prod-actions { display: flex; gap: 8px; }
    .prod-actions button {
      flex: 1; padding: 8px; border-radius: 6px; border: none;
      font-size: 13px; font-weight: bold; cursor: pointer;
    }
    .btn-edit { background: #3498db; color: #fff; }
    .btn-edit:hover { background: #2980b9; }
    .btn-del { background: #e74c3c; color: #fff; }
    .btn-del:hover { background: #c0392b; }

    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8);
      align-items: center; justify-content: center; z-index: 1000; padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: #1e1e3f; border-radius: 16px; width: 100%; max-width: 600px;
      max-height: 90vh; overflow-y: auto; border: 1px solid #333;
    }
    .modal-header {
      padding: 20px 24px; border-bottom: 1px solid #333;
      display: flex; justify-content: space-between; align-items: center;
    }
    .modal-header h3 { font-size: 20px; }
    .modal-header .close {
      background: none; border: none; color: #888; font-size: 24px;
      cursor: pointer;
    }
    .modal-header .close:hover { color: #fff; }
    .modal-body { padding: 24px; }
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block; margin-bottom: 6px; color: #aaa; font-size: 14px;
    }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%; padding: 12px 14px; border: 2px solid #333;
      border-radius: 8px; background: #151530; color: #fff;
      font-size: 15px; outline: none; transition: border-color 0.2s;
    }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
      border-color: #00d4aa;
    }
    .form-group textarea { min-height: 80px; resize: vertical; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-check {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 0;
    }
    .form-check input { width: 20px; height: 20px; accent-color: #00d4aa; }
    .modal-footer {
      padding: 16px 24px; border-top: 1px solid #333;
      display: flex; justify-content: flex-end; gap: 12px;
    }
    .modal-footer button {
      padding: 10px 24px; border-radius: 8px; border: none;
      font-weight: bold; cursor: pointer; font-size: 14px;
    }
    .btn-cancel { background: #333; color: #fff; }
    .btn-save { background: #00d4aa; color: #0f0f23; }

    .loading { text-align: center; padding: 60px; color: #888; }
    .empty { text-align: center; padding: 60px; color: #666; }
    .toast {
      position: fixed; bottom: 24px; right: 24px;
      padding: 14px 24px; border-radius: 10px; font-weight: bold;
      z-index: 2000; animation: slideIn 0.3s ease;
    }
    .toast.sucesso { background: #27ae60; color: #fff; }
    .toast.erro { background: #e74c3c; color: #fff; }
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="login-container" id="loginScreen">
    <div class="login-box">
      <h1>Admin JP Variedades</h1>
      <p>Digite a senha para acessar o painel</p>
      <input type="password" id="senhaInput" placeholder="Senha de admin" onkeypress="if(event.key==='Enter')fazerLogin()">
      <button onclick="fazerLogin()">Entrar</button>
      <div class="erro" id="loginErro"></div>
    </div>
  </div>

  <div class="admin-container" id="adminScreen">
    <div class="topbar">
      <h2>Painel Admin - JP Variedades</h2>
      <div class="actions">
        <button class="btn-novo" onclick="abrirModal()">+ Novo Produto</button>
        <button class="btn-sair" onclick="sair()">Sair</button>
      </div>
    </div>

    <div class="content">
      <div class="stats">
        <div class="stat-card">
          <h4>Total de Produtos</h4>
          <div class="num" id="statTotal">0</div>
        </div>
        <div class="stat-card">
          <h4>Ativos</h4>
          <div class="num" id="statAtivos">0</div>
        </div>
        <div class="stat-card">
          <h4>Destaques</h4>
          <div class="num" id="statDestaques">0</div>
        </div>
        <div class="stat-card">
          <h4>Cliques Totais</h4>
          <div class="num" id="statCliques">0</div>
        </div>
      </div>

      <div id="produtosLista">
        <div class="loading">Carregando produtos...</div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitulo">Novo Produto</h3>
        <button class="close" onclick="fecharModal()">&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="prodId">
        <div class="form-group">
          <label>Nome do Produto *</label>
          <input type="text" id="prodNome" placeholder="Ex: Fone Bluetooth XYZ">
        </div>
        <div class="form-group">
          <label>URL da Imagem *</label>
          <input type="text" id="prodImagem" placeholder="https://...">
        </div>
        <div class="form-group">
          <label>Descricao</label>
          <textarea id="prodDescricao" placeholder="Descricao do produto..."></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Preco Antigo</label>
            <input type="number" id="prodPrecoAntigo" placeholder="99.90" step="0.01">
          </div>
          <div class="form-group">
            <label>Preco Atual *</label>
            <input type="number" id="prodPrecoAtual" placeholder="79.90" step="0.01">
          </div>
        </div>
        <div class="form-group">
          <label>Link de Afiliado *</label>
          <input type="text" id="prodLink" placeholder="https://shopee.com.br/...">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Categoria</label>
            <input type="text" id="prodCategoria" placeholder="Ex: Eletronicos">
          </div>
          <div class="form-group">
            <label>Loja de Origem</label>
            <input type="text" id="prodLoja" placeholder="Ex: Shopee">
          </div>
        </div>
        <div class="form-check">
          <input type="checkbox" id="prodDestaque">
          <label for="prodDestaque" style="margin:0">Produto em Destaque</label>
        </div>
        <div class="form-check">
          <input type="checkbox" id="prodAtivo" checked>
          <label for="prodAtivo" style="margin:0">Produto Ativo (visivel no site)</label>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
        <button class="btn-save" onclick="salvarProduto()">Salvar Produto</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://ochenyjboagfybazcsi.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9jaGV5bnlqYm9hZ2Z5YmF6Y3NpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4ODMzODUsImV4cCI6MjEwMDQ1OTM4NX0.wE7VFVmo38_mjSnvByhxQdL3fsEQAf2LE1tMkkTrOKU';
    const SENHA_ADMIN = 'jpvariedades2024';

    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let produtosCache = [];

    function fazerLogin() {
      const senha = document.getElementById('senhaInput').value;
      if (senha === SENHA_ADMIN) {
        localStorage.setItem('admin_jp_logado', 'true');
        mostrarAdmin();
      } else {
        document.getElementById('loginErro').textContent = 'Senha incorreta!';
      }
    }

    function sair() {
      localStorage.removeItem('admin_jp_logado');
      location.reload();
    }

    function mostrarAdmin() {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('adminScreen').style.display = 'block';
      carregarProdutos();
      ativarRealtime();
    }

    if (localStorage.getItem('admin_jp_logado') === 'true') {
      mostrarAdmin();
    }

    async function carregarProdutos() {
      const { data, error } = await supabase
        .from('produtos')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        document.getElementById('produtosLista').innerHTML = 
          '<div class="empty">Erro ao carregar: ' + error.message + '</div>';
        return;
      }

      produtosCache = data || [];
      atualizarStats();
      renderizarProdutos();
    }

    function atualizarStats() {
      document.getElementById('statTotal').textContent = produtosCache.length;
      document.getElementById('statAtivos').textContent = produtosCache.filter(p => p.ativo).length;
      document.getElementById('statDestaques').textContent = produtosCache.filter(p => p.destaque).length;
      document.getElementById('statCliques').textContent = produtosCache.reduce((a, p) => a + (p.cliques || 0), 0);
    }

    function renderizarProdutos() {
      const container = document.getElementById('produtosLista');
      if (produtosCache.length === 0) {
        container.innerHTML = '<div class="empty">Nenhum produto cadastrado. Clique em "+ Novo Produto" para comecar!</div>';
        return;
      }

      container.innerHTML = '<div class="produtos-grid">' + produtosCache.map(p => `
        <div class="prod-card">
          <img src="${p.imagem_url || 'https://via.placeholder.com/300x180?text=Sem+Imagem'}" alt="${p.nome}">
          <div class="prod-info">
            <span class="status ${p.ativo ? 'status-ativo' : 'status-inativo'}">${p.ativo ? 'ATIVO' : 'INATIVO'}</span>
            <h3>${p.nome}</h3>
            <div class="preco">R$ ${Number(p.preco_atual || p.preco || 0).toFixed(2)}</div>
            <div class="cat">${p.categoria || 'Sem categoria'} - ${p.loja_origem || 'Sem loja'}</div>
            <div class="prod-actions">
              <button class="btn-edit" onclick="editarProduto('${p.id}')">Editar</button>
              <button class="btn-del" onclick="excluirProduto('${p.id}')">Excluir</button>
            </div>
          </div>
        </div>
      `).join('') + '</div>';
    }

    function ativarRealtime() {
      supabase
        .channel('admin-produtos')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'produtos' }, () => {
          carregarProdutos();
          mostrarToast('Dados atualizados em tempo real!', 'sucesso');
        })
        .subscribe();
    }

    function abrirModal() {
      document.getElementById('modalTitulo').textContent = 'Novo Produto';
      document.getElementById('prodId').value = '';
      document.getElementById('prodNome').value = '';
      document.getElementById('prodImagem').value = '';
      document.getElementById('prodDescricao').value = '';
      document.getElementById('prodPrecoAntigo').value = '';
      document.getElementById('prodPrecoAtual').value = '';
      document.getElementById('prodLink').value = '';
      document.getElementById('prodCategoria').value = '';
      document.getElementById('prodLoja').value = '';
      document.getElementById('prodDestaque').checked = false;
      document.getElementById('prodAtivo').checked = true;
      document.getElementById('modal').classList.add('active');
    }

    function fecharModal() {
      document.getElementById('modal').classList.remove('active');
    }

    function editarProduto(id) {
      const p = produtosCache.find(x => x.id === id);
      if (!p) return;

      document.getElementById('modalTitulo').textContent = 'Editar Produto';
      document.getElementById('prodId').value = p.id;
      document.getElementById('prodNome').value = p.nome || '';
      document.getElementById('prodImagem').value = p.imagem_url || '';
      document.getElementById('prodDescricao').value = p.descricao || '';
      document.getElementById('prodPrecoAntigo').value = p.preco_antigo || '';
      document.getElementById('prodPrecoAtual').value = p.preco_atual || p.preco || '';
      document.getElementById('prodLink').value = p.link_afiliado || '';
      document.getElementById('prodCategoria').value = p.categoria || '';
      document.getElementById('prodLoja').value = p.loja_origem || '';
      document.getElementById('prodDestaque').checked = p.destaque || false;
      document.getElementById('prodAtivo').checked = p.ativo !== false;
      document.getElementById('modal').classList.add('active');
    }

    async function salvarProduto() {
      const id = document.getElementById('prodId').value;
      const dados = {
        nome: document.getElementById('prodNome').value.trim(),
        imagem_url: document.getElementById('prodImagem').value.trim(),
        descricao: document.getElementById('prodDescricao').value.trim(),
        preco_antigo: parseFloat(document.getElementById('prodPrecoAntigo').value) || null,
        preco_atual: parseFloat(document.getElementById('prodPrecoAtual').value) || 0,
        link_afiliado: document.getElementById('prodLink').value.trim(),
        categoria: document.getElementById('prodCategoria').value.trim(),
        loja_origem: document.getElementById('prodLoja').value.trim(),
        destaque: document.getElementById('prodDestaque').checked,
        ativo: document.getElementById('prodAtivo').checked,
      };

      if (!dados.nome || !dados.imagem_url || !dados.link_afiliado) {
        mostrarToast('Preencha os campos obrigatorios (*)', 'erro');
        return;
      }

      let error;
      if (id) {
        const res = await supabase.from('produtos').update(dados).eq('id', id);
        error = res.error;
      } else {
        const res = await supabase.from('produtos').insert([dados]);
        error = res.error;
      }

      if (error) {
        mostrarToast('Erro: ' + error.message, 'erro');
      } else {
        mostrarToast(id ? 'Produto atualizado!' : 'Produto criado!', 'sucesso');
        fecharModal();
        carregarProdutos();
      }
    }

    async function excluirProduto(id) {
      if (!confirm('Tem certeza que deseja excluir este produto?')) return;

      const { error } = await supabase.from('produtos').delete().eq('id', id);
      if (error) {
        mostrarToast('Erro ao excluir: ' + error.message, 'erro');
      } else {
        mostrarToast('Produto excluido!', 'sucesso');
        carregarProdutos();
      }
    }

    function mostrarToast(msg, tipo) {
      const t = document.createElement('div');
      t.className = 'toast ' + tipo;
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }

    document.getElementById('modal').addEventListener('click', (e) => {
      if (e.target.id === 'modal') fecharModal();
    });
  </script>
</body>
</html>
