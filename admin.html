<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Admin - JP Variedades</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#fff;min-height:100vh}

.login{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:linear-gradient(180deg,#0a0a0a 0%,#141414 100%)}
.login-logo{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#00c853,#00e676);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;font-style:italic;color:#000;margin-bottom:16px}
.login h1{font-size:22px;margin-bottom:4px}
.login p{color:#888;font-size:13px;margin-bottom:24px}
.login input{width:100%;max-width:320px;padding:14px 16px;border-radius:12px;border:1px solid #2a2a2a;background:#1a1a1a;color:#fff;font-size:16px;margin-bottom:12px;outline:none}
.login input:focus{border-color:#00e676}
.login button{width:100%;max-width:320px;padding:14px;border-radius:12px;border:none;background:#00e676;color:#000;font-size:16px;font-weight:700;cursor:pointer}
.login .erro{color:#ff5252;margin-top:12px;font-size:13px;text-align:center}

.admin{display:none}
.topbar{position:sticky;top:0;z-index:100;background:#141414;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2a2a2a}
.topbar h2{font-size:16px}
.topbar button{padding:8px 14px;border-radius:8px;border:none;background:#ff5252;color:#fff;font-size:12px;font-weight:700;cursor:pointer}

.stats{display:flex;gap:8px;padding:12px 16px;overflow-x:auto}
.stat{flex:1;min-width:80px;background:#1a1a1a;padding:12px;border-radius:10px;text-align:center;border:1px solid #2a2a2a}
.stat b{display:block;font-size:20px;color:#00e676;margin-bottom:2px}
.stat span{font-size:10px;color:#888}

.list{padding:0 16px 100px}
.item{display:flex;align-items:center;gap:10px;padding:10px;background:#1a1a1a;border-radius:10px;border:1px solid #2a2a2a;margin-bottom:8px}
.item img{width:56px;height:56px;border-radius:8px;object-fit:cover;background:#242424}
.item-info{flex:1;min-width:0}
.item-info h4{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.item-info .price{font-size:14px;color:#00e676;font-weight:700}
.item-info .loja{font-size:11px;color:#888}
.item-actions{display:flex;gap:6px}
.item-actions button{width:32px;height:32px;border-radius:6px;border:none;background:#242424;color:#fff;font-size:14px;cursor:pointer}

.empty{text-align:center;padding:40px;color:#666}

.fab{position:fixed;bottom:20px;right:20px;width:56px;height:56px;border-radius:50%;border:none;background:#00e676;color:#000;font-size:28px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(0,200,100,0.3);z-index:200}

.modal{position:fixed;inset:0;background:rgba(0,0,0,0.9);display:none;flex-direction:column;z-index:300}
.modal.active{display:flex}
.modal-h{padding:16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2a2a2a;background:#141414}
.modal-h h3{font-size:16px}
.modal-h button{width:32px;height:32px;border-radius:50%;border:none;background:#242424;color:#fff;font-size:18px;cursor:pointer}
.modal-body{flex:1;overflow-y:auto;padding:16px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;color:#888;margin-bottom:4px;font-weight:600}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #2a2a2a;background:#0a0a0a;color:#fff;font-size:15px;outline:none}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#00e676}
.form-group textarea{min-height:80px;resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-check{display:flex;align-items:center;gap:8px;padding:8px 0}
.form-check input{width:20px;height:20px;accent-color:#00e676}
.save-btn{width:100%;padding:14px;border-radius:10px;border:none;background:#00e676;color:#000;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:12px 20px;border-radius:50px;font-size:13px;border:1px solid #2a2a2a;z-index:400;display:none}
.toast.show{display:block}
.toast.ok{border-color:#00e676;color:#00e676}
.toast.err{border-color:#ff5252;color:#ff5252}
</style>
</head>
<body>

<div class="login" id="loginScreen">
  <div class="login-logo">JP</div>
  <h1>JP Variedades</h1>
  <p>Painel Administrativo</p>
  <input type="password" id="senhaInput" placeholder="Digite a senha">
  <button onclick="doLogin()">Entrar</button>
  <div class="erro" id="loginErro"></div>
</div>

<div class="admin" id="adminScreen">
  <div class="topbar">
    <h2>Meus Produtos</h2>
    <button onclick="logout()">Sair</button>
  </div>
  <div class="stats">
    <div class="stat"><b id="stTotal">0</b><span>Total</span></div>
    <div class="stat"><b id="stAtivo">0</b><span>Ativos</span></div>
    <div class="stat"><b id="stDest">0</b><span>Destaques</span></div>
    <div class="stat"><b id="stClick">0</b><span>Cliques</span></div>
  </div>
  <div class="list" id="lista"></div>
  <button class="fab" onclick="openForm()">+</button>
</div>

<div class="modal" id="formModal">
  <div class="modal-h">
    <h3 id="formTitle">Novo Produto</h3>
    <button onclick="closeForm()">&times;</button>
  </div>
  <div class="modal-body">
    <input type="hidden" id="pid">
    <div class="form-group">
      <label>Nome do produto *</label>
      <input type="text" id="pNome" placeholder="Ex: Creatina 1kg">
    </div>
    <div class="form-group">
      <label>Link do afiliado *</label>
      <input type="text" id="pLink" placeholder="https://meli.la/...">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Preco atual R$ *</label>
        <input type="number" id="pPreco" placeholder="59.90" step="0.01">
      </div>
      <div class="form-group">
        <label>Preco de R$</label>
        <input type="number" id="pOld" placeholder="239.90" step="0.01">
      </div>
    </div>
    <div class="form-group">
      <label>URL da imagem *</label>
      <input type="text" id="pImg" placeholder="https://...">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Loja *</label>
        <select id="pLoja">
          <option value="Mercado Livre">Mercado Livre</option>
          <option value="Shopee">Shopee</option>
          <option value="Outro">Outro</option>
        </select>
      </div>
      <div class="form-group">
        <label>Categoria</label>
        <input type="text" id="pCat" placeholder="Ex: Academia">
      </div>
    </div>
    <div class="form-group">
      <label>Descricao</label>
      <textarea id="pDesc" placeholder="Descricao do produto..."></textarea>
    </div>
    <div class="form-check">
      <input type="checkbox" id="pDest">
      <label for="pDest">Destacar produto</label>
    </div>
    <div class="form-check">
      <input type="checkbox" id="pAtivo" checked>
      <label for="pAtivo">Produto ativo</label>
    </div>
    <button class="save-btn" onclick="saveProd()">Salvar Produto</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_URL = 'https://ochenyjboagfybazcsi.supabase.co/rest/v1/produtos';
const API_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9jaGV5bnlqYm9hZ2Z5YmF6Y3NpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4ODMzODUsImV4cCI6MjEwMDQ1OTM4NX0.wE7VFVmo38_mjSnvByhxQdL3fsEQAf2LE1tMkkTrOKU';
const SENHA = 'jpvariedades2024';

let produtos = [];
let editando = null;

const headers = {
  'apikey': API_KEY,
  'Authorization': 'Bearer ' + API_KEY,
  'Content-Type': 'application/json',
  'Prefer': 'return=representation'
};

function toast(msg, ok) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (ok ? 'ok' : 'err');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function doLogin() {
  if (document.getElementById('senhaInput').value === SENHA) {
    localStorage.setItem('jp_admin', '1');
    showAdmin();
  } else {
    document.getElementById('loginErro').textContent = 'Senha incorreta';
  }
}

function logout() {
  localStorage.removeItem('jp_admin');
  location.reload();
}

function showAdmin() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('adminScreen').style.display = 'block';
  loadProds();
}

if (localStorage.getItem('jp_admin') === '1') showAdmin();

document.getElementById('senhaInput').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') doLogin();
});

async function loadProds() {
  try {
    const res = await fetch(API_URL + '?order=created_at.desc', { headers });
    if (!res.ok) throw new Error('Erro ' + res.status);
    produtos = await res.json();
    render();
  } catch(e) {
    toast('Erro ao carregar: ' + e.message, false);
  }
}

function render() {
  document.getElementById('stTotal').textContent = produtos.length;
  document.getElementById('stAtivo').textContent = produtos.filter(p => p.ativo).length;
  document.getElementById('stDest').textContent = produtos.filter(p => p.destaque).length;
  document.getElementById('stClick').textContent = produtos.reduce((a, p) => a + (p.cliques || 0), 0);

  const el = document.getElementById('lista');
  if (!produtos.length) {
    el.innerHTML = '<div class="empty">Nenhum produto. Clique no + para adicionar!</div>';
    return;
  }

  el.innerHTML = produtos.map(p => {
    const preco = parseFloat(p.preco_atual || 0).toFixed(2).replace('.',',');
    return `<div class="item">
      <img src="${p.imagem_url || 'https://via.placeholder.com/56?text=JP'}" onerror="this.src='https://via.placeholder.com/56?text=JP'">
      <div class="item-info">
        <h4>${p.nome}</h4>
        <div class="price">R$ ${preco}</div>
        <div class="loja">${p.loja_origem || ''} ${p.destaque ? '⭐' : ''} ${p.ativo ? '' : '(inativo)'}</div>
      </div>
      <div class="item-actions">
        <button onclick="editProd('${p.id}')">✏️</button>
        <button onclick="delProd('${p.id}')">🗑️</button>
      </div>
    </div>`;
  }).join('');
}

function openForm() {
  editando = null;
  document.getElementById('formTitle').textContent = 'Novo Produto';
  document.getElementById('pid').value = '';
  document.getElementById('pNome').value = '';
  document.getElementById('pLink').value = '';
  document.getElementById('pPreco').value = '';
  document.getElementById('pOld').value = '';
  document.getElementById('pImg').value = '';
  document.getElementById('pLoja').value = 'Mercado Livre';
  document.getElementById('pCat').value = '';
  document.getElementById('pDesc').value = '';
  document.getElementById('pDest').checked = false;
  document.getElementById('pAtivo').checked = true;
  document.getElementById('formModal').classList.add('active');
}

function closeForm() {
  document.getElementById('formModal').classList.remove('active');
}

function editProd(id) {
  const p = produtos.find(x => x.id === id);
  if (!p) return;
  editando = p;
  document.getElementById('formTitle').textContent = 'Editar Produto';
  document.getElementById('pid').value = p.id;
  document.getElementById('pNome').value = p.nome || '';
  document.getElementById('pLink').value = p.link_afiliado || '';
  document.getElementById('pPreco').value = p.preco_atual || '';
  document.getElementById('pOld').value = p.preco_antigo || '';
  document.getElementById('pImg').value = p.imagem_url || '';
  document.getElementById('pLoja').value = p.loja_origem || 'Mercado Livre';
  document.getElementById('pCat').value = p.categoria || '';
  document.getElementById('pDesc').value = p.descricao || '';
  document.getElementById('pDest').checked = p.destaque || false;
  document.getElementById('pAtivo').checked = p.ativo !== false;
  document.getElementById('formModal').classList.add('active');
}

async function saveProd() {
  const dados = {
    nome: document.getElementById('pNome').value.trim(),
    link_afiliado: document.getElementById('pLink').value.trim(),
    preco_atual: parseFloat(document.getElementById('pPreco').value) || 0,
    preco_antigo: parseFloat(document.getElementById('pOld').value) || null,
    imagem_url: document.getElementById('pImg').value.trim(),
    loja_origem: document.getElementById('pLoja').value,
    categoria: document.getElementById('pCat').value.trim(),
    descricao: document.getElementById('pDesc').value.trim(),
    destaque: document.getElementById('pDest').checked,
    ativo: document.getElementById('pAtivo').checked,
  };

  if (!dados.nome || !dados.link_afiliado || !dados.imagem_url) {
    toast('Preencha nome, link e imagem!', false);
    return;
  }

  try {
    let res;
    if (editando) {
      res = await fetch(API_URL + '?id=eq.' + editando.id, {
        method: 'PATCH',
        headers: headers,
        body: JSON.stringify(dados)
      });
    } else {
      res = await fetch(API_URL, {
        method: 'POST',
        headers: headers,
        body: JSON.stringify(dados)
      });
    }

    if (!res.ok) {
      const err = await res.text();
      throw new Error(err || 'Erro ' + res.status);
    }

    toast(editando ? 'Atualizado!' : 'Adicionado!', true);
    closeForm();
    loadProds();
  } catch(e) {
    toast('Erro: ' + e.message, false);
  }
}

async function delProd(id) {
  if (!confirm('Excluir este produto?')) return;
  try {
    const res = await fetch(API_URL + '?id=eq.' + id, {
      method: 'DELETE',
      headers: headers
    });
    if (!res.ok) throw new Error('Erro ' + res.status);
    toast('Excluido!', true);
    loadProds();
  } catch(e) {
    toast('Erro: ' + e.message, false);
  }
}
</script>
</body>
</html>
