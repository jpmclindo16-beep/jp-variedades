<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<title>Admin - JP Variedades</title>
<style>
:root{--bg:#0a0a0a;--card:#1a1a1a;--border:#2a2a2a;--text:#fff;--muted:#a0a0a0;--accent:#00e676;--accent-dark:#00c853;--danger:#ff5252}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.login{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:#0a0a0a}
.login-logo{width:80px;height:80px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;color:#000;margin-bottom:16px}
.login h1{font-size:22px;margin-bottom:4px}
.login p{color:var(--muted);font-size:13px;margin-bottom:24px}
.login input{width:100%;max-width:320px;padding:14px 16px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:16px;margin-bottom:12px;outline:none}
.login button{width:100%;max-width:320px;padding:14px;border-radius:12px;border:none;background:var(--accent);color:#000;font-size:16px;font-weight:700;cursor:pointer}
.login .erro{color:var(--danger);margin-top:12px;font-size:13px;text-align:center}
.admin{display:none}
.admin.on{display:block}
.topbar{position:sticky;top:0;z-index:100;background:var(--card);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.topbar h2{font-size:16px}
.topbar button{padding:8px 14px;border-radius:8px;border:none;background:var(--danger);color:#fff;font-size:12px;font-weight:700;cursor:pointer}
.main{padding:16px}
.page{display:none}
.page.on{display:block}
.card{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:16px;margin-bottom:16px}
</style>
</head>
<body>

<div class="login" id="loginScreen">
  <div class="login-logo">JP</div>
  <h1>JP Variedades</h1>
  <p>Painel Administrativo</p>
  <input type="password" id="senhaInput" placeholder="Digite a senha">
  <button onclick="fazerLogin()">Entrar</button>
  <div class="erro" id="loginErro"></div>
</div>

<div class="admin" id="adminScreen">
  <div class="topbar">
    <h2>🛒 JP Admin</h2>
    <button onclick="sair()">Sair</button>
  </div>
  <div class="main">
    <div class="page on" id="page-dash">
      <div class="card">
        <h3>Painel Carregado com Sucesso!</h3>
        <p style="color:var(--muted); margin-top:8px;">Seu login funcionou perfeitamente.</p>
      </div>
    </div>
  </div>
</div>

<script>
const SENHA_MESTRE = 'jpvariedades2024';

function fazerLogin() {
  var input = document.getElementById('senhaInput').value;
  var erro = document.getElementById('loginErro');
  
  if (input === SENHA_MESTRE) {
    localStorage.setItem('jp_logado', 'true');
    liberarPainel();
  } else {
    erro.textContent = 'Senha incorreta!';
  }
}

function liberarPainel() {
  document.getElementById('loginScreen').style.display = 'none';
  var admin = document.getElementById('adminScreen');
  admin.style.display = 'block';
  admin.classList.add('on');
}

function sair() {
  localStorage.removeItem('jp_logado');
  location.reload();
}

// Verifica se já estava logado ao abrir
if (localStorage.getItem('jp_logado') === 'true') {
  liberarPainel();
}
</script>
</body>
</html>
