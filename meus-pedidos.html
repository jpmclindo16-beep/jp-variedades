<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<title>Meus Pedidos - JP Variedades</title>
<style>
:root{--bg:#0a0a0a;--card:#141414;--border:#252525;--text:#fff;--muted:#999;--accent:#00e676;--accent-dark:#00c853;--danger:#ff5252;--warning:#ffc107}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* LOADING */
#loadingScreen{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .4s}
#loadingScreen.hide{opacity:0;pointer-events:none}
.spinner{width:48px;height:48px;border:4px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.header{background:var(--card);border-bottom:1px solid var(--border);padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.voltar{color:var(--text);text-decoration:none;font-size:22px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--border)}
.logo{font-weight:800;font-size:16px}

.container{max-width:600px;margin:auto;padding:16px 16px 50px}

/* IDENTIFICAR */
.identify-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px}
.identify-card h3{font-size:14px;margin-bottom:10px;color:var(--muted)}
.identify-card p{font-size:13px;color:var(--muted);margin-bottom:12px;line-height:1.5}
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
.field input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;outline:none}
.field input:focus{border-color:var(--accent)}
.btn{width:100%;border:0;border-radius:12px;padding:14px;background:var(--accent);color:#000;font-size:15px;font-weight:800;cursor:pointer;text-align:center}

/* PEDIDO CARD */
.pedido-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
.pedido-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.pedido-id{font-size:12px;font-weight:700;color:var(--muted)}
.pedido-status{font-size:11px;font-weight:800;padding:4px 10px;border-radius:50px}
.status-pago{background:rgba(0,230,118,.15);color:var(--accent)}
.status-pendente{background:rgba(255,193,7,.15);color:var(--warning)}
.status-enviado{background:rgba(0,150,255,.15);color:#4facfe}
.status-entregue{background:rgba(0,230,118,.15);color:var(--accent)}
.status-cancelado{background:rgba(255,82,82,.15);color:var(--danger)}
.pedido-prod{font-size:13px;font-weight:600;margin-bottom:6px;line-height:1.4}
.pedido-valor{color:var(--accent);font-size:15px;font-weight:800;margin-bottom:8px}
.pedido-info{font-size:12px;color:var(--muted);line-height:1.6}
.pedido-actions{display:flex;gap:8px;margin-top:12px}
.pedido-actions a{flex:1;padding:10px;border-radius:10px;text-align:center;text-decoration:none;font-size:12px;font-weight:700}
.btn-rastreio{background:var(--border);color:var(--text)}
.btn-rastreio-active{background:var(--accent);color:#000}

.empty-state{text-align:center;padding:40px;color:var(--muted);font-size:14px}

/* TOAST */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--card);color:var(--text);padding:12px 20px;border-radius:50px;font-size:13px;border:1px solid var(--border);z-index:3000;display:none;white-space:nowrap}
.toast.show{display:block}
</style>
</head>
<body>

<div id="loadingScreen">
  <div class="spinner"></div>
  <div style="color:var(--muted);font-size:14px">Carregando...</div>
</div>

<div class="header">
  <a href="index.html" class="voltar">←</a>
  <div class="logo">📦 Meus Pedidos</div>
</div>

<div class="container">

  <div id="identifyBox" class="identify-card">
    <h3>🔐 Identifique-se</h3>
    <p>Digite seu CPF ou telefone para ver todos os seus pedidos e acompanhar as entregas.</p>
    <div class="field">
      <label>CPF ou Telefone</label>
      <input type="text" id="identificador" placeholder="000.000.000-00 ou (00) 00000-0000">
    </div>
    <button class="btn" onclick="buscarPedidos()">Buscar meus pedidos</button>
  </div>

  <div id="pedidosBox" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <h3 style="font-size:15px">Seus pedidos</h3>
      <button onclick="sair()" style="background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer">Sair</button>
    </div>
    <div id="pedidosList"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL='https://ocheynyjboagfybazcsi.supabase.co';
const SUPABASE_KEY='sb_publishable_kL_nA7Fv-uHbC5mx8Hqm6A_XluBgT29';

function fmt(p){return'R$ '+Number(p).toFixed(2).replace('.',',')}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}

function limpar(v){return v.replace(/\D/g,'');}

function getStatusClass(s){
  if(s==='pago'||s==='entregue')return'status-pago';
  if(s==='enviado')return'status-enviado';
  if(s==='aguardando_pagamento'||s==='em_analise')return'status-pendente';
  return'status-cancelado';
}
function getStatusLabel(s){
  const map={pago:'Pago ✅',aguardando_pagamento:'Aguardando ⏳',em_analise:'Em análise',enviado:'Enviado 🚚',entregue:'Entregue 🎉',cancelado:'Cancelado ❌',reembolsado:'Reembolsado'};
  return map[s]||'Processando';
}

async function buscarPedidos(){
  const val=document.getElementById('identificador').value.trim();
  if(!val){toast('Digite seu CPF ou telefone');return}
  const limpo=limpar(val);
  if(limpo.length<10){toast('Identificador muito curto');return}

  document.getElementById('loadingScreen').classList.remove('hide');

  try{
    // Busca por CPF ou telefone
    const url=SUPABASE_URL+'/rest/v1/pedidos?or=(cliente_cpf.eq.'+encodeURIComponent(limpo)+',cliente_telefone.eq.'+encodeURIComponent(limpo)+')&order=criado_em.desc';
    const res=await fetch(url,{headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}});
    const dados=await res.json();

    if(!dados || !dados.length){
      toast('Nenhum pedido encontrado para esse CPF/telefone');
      document.getElementById('loadingScreen').classList.add('hide');
      return;
    }

    // Salva identificador
    localStorage.setItem('jp_identificador',val);

    renderPedidos(dados);
    document.getElementById('identifyBox').style.display='none';
    document.getElementById('pedidosBox').style.display='block';
    document.getElementById('loadingScreen').classList.add('hide');
  }catch(e){
    toast('Erro ao buscar pedidos');
    document.getElementById('loadingScreen').classList.add('hide');
  }
}

function renderPedidos(lista){
  const container=document.getElementById('pedidosList');
  container.innerHTML=lista.map(p=>{
    let nomeProd=p.produto_nome||'Produto';
    try{
      const items=typeof p.items==='string'?JSON.parse(p.items):p.items;
      if(Array.isArray(items) && items.length){
        nomeProd=items.map(x=>x.nome).join(', ');
        if(nomeProd.length>60) nomeProd=nomeProd.substring(0,60)+'...';
      }
    }catch(e){}

    const data=new Date(p.criado_em).toLocaleDateString('pt-BR');
    const stClass=getStatusClass(p.status_pedido);
    const stLabel=getStatusLabel(p.status_pedido);
    const temRastreio=p.codigo_rastreio && p.status_pedido==='enviado';

    return`<div class="pedido-card">
      <div class="pedido-header">
        <span class="pedido-id">#${p.external_reference||p.id}</span>
        <span class="pedido-status ${stClass}">${stLabel}</span>
      </div>
      <div class="pedido-prod">${nomeProd}</div>
      <div class="pedido-valor">${fmt(Number(p.valor||0))}</div>
      <div class="pedido-info">
        📅 ${data}<br>
        👤 ${p.cliente_nome||'-'}<br>
        📍 ${p.cliente_cidade||'-'} / ${p.cliente_estado||'-'}<br>
        ${p.codigo_rastreio?'📮 Código: '+p.codigo_rastreio+'<br>':''}
      </div>
      <div class="pedido-actions">
        ${temRastreio?`<a href="https://linkrastreio.com.br/${p.codigo_rastreio}" target="_blank" class="btn-rastreio-active">📮 Rastrear</a>`:`<span class="btn-rastreio" style="flex:1;padding:10px;border-radius:10px;text-align:center;font-size:12px;font-weight:700;color:var(--muted)">Sem rastreio ainda</span>`}
        <a href="pedido.html?external_reference=${encodeURIComponent(p.external_reference||'')}" class="btn-rastreio">Ver detalhes</a>
      </div>
    </div>`;
  }).join('');
}

function sair(){
  localStorage.removeItem('jp_identificador');
  document.getElementById('identifyBox').style.display='block';
  document.getElementById('pedidosBox').style.display='none';
  document.getElementById('identificador').value='';
}

// Auto-login se já tiver identificador
window.addEventListener('load',()=>{
  const saved=localStorage.getItem('jp_identificador');
  if(saved){
    document.getElementById('identificador').value=saved;
    buscarPedidos();
  }else{
    document.getElementById('loadingScreen').classList.add('hide');
  }
});
</script>
</body>
</html>
