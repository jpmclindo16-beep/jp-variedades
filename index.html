<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JP Variedades</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #0a0a0b; color: #fff; padding: 20px; }
    .card { background: #17171a; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    img { max-width: 100%; border-radius: 8px; background: #333; }
    .link { font-size: 12px; color: #ff4d8d; word-break: break-all; margin-top: 8px; }
    .preco { color: #ff4d8d; font-weight: bold; margin: 8px 0; }
  </style>
</head>
<body>
  <h1 style="color:#ff4d8d; margin-bottom:20px">JP Variedades (Debug)</h1>
  <div id="lista">Carregando...</div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const supabase = createClient(
      'https://ocheynyjboagfybazcsi.supabase.co',
      'sb_publishable_kL_nA7Fv-uHbC5mx8Hqm6A_XluBgT29'
    );

    async function carregar() {
      const { data, error } = await supabase.from('produtos').select('*').order('id', {ascending:false});
      const lista = document.getElementById('lista');

      if (error) {
        lista.innerHTML = 'Erro: ' + error.message;
        return;
      }

      if (!data.length) {
        lista.innerHTML = 'Nenhum produto';
        return;
      }

      lista.innerHTML = '';
      data.forEach(p => {
        lista.innerHTML += `
          <div class="card">
            <img src="${p.imagem_url || ''}" onerror="this.alt='FALHOU'">
            <h3>${p.nome}</h3>
            <div class="preco">R$ ${p.preco}</div>
            <div class="link">Link salvo no banco:<br>${p.imagem_url || '(vazio)'}</div>
          </div>
        `;
      });
    }
    carregar();
  </script>
</body>
</html>
