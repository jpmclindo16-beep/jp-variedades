<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<title>JP Variedades</title>

<style>
:root{
  --bg:#0a0a0a;
  --card:#1a1a1a;
  --border:#2a2a2a;
  --text:#fff;
  --muted:#a0a0a0;
  --accent:#00e676;
  --accent-dark:#00c853;
  --danger:#ff5252;
}

body.light{
  --bg:#f5f5f5;
  --card:#fff;
  --border:#ddd;
  --text:#1a1a1a;
  --muted:#666;
  --accent:#00c853;
  --accent-dark:#009624;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  transition:.3s;
}

/* BANNER */
.banner{
  background:linear-gradient(90deg,var(--accent-dark),var(--accent));
  color:#000;
  text-align:center;
  padding:10px;
  font-size:13px;
  font-weight:700;
}

/* HEADER */
.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 16px;
  background:var(--card);
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo-circle{
  width:44px;
  height:44px;
  border-radius:50%;
  background:url("logo%20(2).png") center/cover;
  cursor:pointer;
}

.logo h1{
  font-size:16px;
}

.logo p{
  font-size:12px;
  color:var(--muted);
}

.actions{
  display:flex;
  gap:8px;
}

.btn-icon{
  width:36px;
  height:36px;
  border-radius:50%;
  border:none;
  background:var(--border);
  color:var(--text);
  font-size:16px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* SEARCH */
.search{
  padding:12px 16px;
  position:relative;
}

.search input{
  width:100%;
  padding:14px 16px;
  border-radius:50px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  font-size:15px;
  outline:none;
}

.search input::placeholder{
  color:var(--muted);
}

.suggestions{
  position:absolute;
  top:100%;
  left:16px;
  right:16px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  margin-top:4px;
  max-height:280px;
  overflow-y:auto;
  z-index:500;
  display:none;
}

.suggestions.show{
  display:block;
}

.suggestion-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  cursor:pointer;
}

.suggestion-item:hover{
  background:var(--border);
}

.suggestion-item img{
  width:40px;
  height:40px;
  border-radius:7px;
  object-fit:cover;
}

.suggestion-item span{
  font-size:13px;
}

/* HERO */
.hero{
  text-align:center;
  padding:25px 16px 15px;
}

.big-logo{
  width:90px;
  height:90px;
  margin:0 auto 15px;
  border-radius:50%;
  background:url("logo%20(2).png") center/cover;
  cursor:pointer;
}

.hero h2{
  font-size:24px;
  margin-bottom:7px;
}

.hero p{
  color:var(--muted);
  font-size:14px;
  max-width:320px;
  margin:0 auto 18px;
}

.stats{
  display:flex;
  justify-content:center;
  gap:10px;
}

.stat{
  background:var(--card);
  padding:12px 15px;
  border-radius:12px;
  border:1px solid var(--border);
  text-align:center;
  min-width:85px;
}

.stat b{
  font-size:17px;
  color:var(--accent);
}

.stat span{
  font-size:10px;
  color:var(--muted);
}

/* CATEGORIAS */
.cats{
  display:flex;
  gap:8px;
  padding:12px 16px;
  overflow-x:auto;
  scrollbar-width:none;
}

.cats::-webkit-scrollbar{
  display:none;
}

.cats button{
  padding:10px 17px;
  border-radius:50px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--muted);
  font-size:12px;
  font-weight:600;
  cursor:pointer;
  white-space:nowrap;
}

.cats button.active{
  background:var(--accent);
  color:#000;
  border-color:var(--accent);
}

/* TITULO */
.sec-title{
  padding:14px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:15px;
  font-weight:700;
}

.sec-title span{
  background:var(--border);
  padding:5px 11px;
  border-radius:50px;
  font-size:11px;
  color:var(--muted);
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding:0 16px 110px;
}

.card{
  background:var(--card);
  border-radius:13px;
  overflow:hidden;
  border:1px solid var(--border);
}

.card-img{
  position:relative;
  aspect-ratio:1;
  background:var(--border);
}

.card-img img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.badge{
  position:absolute;
  top:6px;
  left:6px;
  padding:4px 7px;
  border-radius:50px;
  font-size:8px;
  font-weight:800;
}

.b-ml{
  background:#ffe600;
  color:#000;
}

.b-sh{
  background:#ee4d2d;
  color:#fff;
}

.b-shein{
  background:#111;
  color:#fff;
}

.b-disc{
  background:var(--accent);
  color:#000;
}

.b-ds{
  background:#7c4dff;
  color:#fff;
}

.b-best{
  position:absolute;
  top:6px;
  right:38px;
  padding:4px 7px;
  border-radius:50px;
  font-size:8px;
  font-weight:800;
  background:var(--danger);
  color:#fff;
}

.fav{
  position:absolute;
  top:6px;
  right:6px;
  width:28px;
  height:28px;
  border-radius:50%;
  border:none;
  background:rgba(0,0,0,.6);
  color:#fff;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}

.fav.active{
  background:var(--danger);
}

.card-info{
  padding:10px;
}

.card-title{
  font-size:12px;
  font-weight:600;
  line-height:1.4;
  margin-bottom:7px;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.card-price{
  font-size:16px;
  font-weight:800;
  color:var(--accent);
}

.card-old{
  text-decoration:line-through;
  color:var(--muted);
  font-size:10px;
  margin-left:5px;
}

.card-discount{
  background:var(--accent);
  color:#000;
  padding:2px 5px;
  border-radius:4px;
  font-size:9px;
  font-weight:800;
  margin-left:5px;
}

.card-foot{
  display:flex;
  align-items:center;
  gap:7px;
  margin-top:10px;
}

.buy-btn{
  flex:1;
  padding:9px 4px;
  border-radius:50px;
  border:none;
  background:var(--accent);
  color:#000;
  font-size:11px;
  font-weight:800;
  cursor:pointer;
}

.share{
  width:32px;
  height:32px;
  border-radius:50%;
  border:none;
  background:var(--border);
  color:var(--muted);
  cursor:pointer;
}

/* ESTADOS */
.empty,
.loading{
  text-align:center;
  padding:50px 20px;
  color:var(--muted);
  grid-column:1/-1;
}

.error-box{
  text-align:center;
  padding:35px 20px;
  color:#ff8080;
  grid-column:1/-1;
}

/* FAVORITOS */
.fav-page{
  display:none;
}

.fav-page.active{
  display:block;
}

/* WHATSAPP */
.whatsapp-float{
  position:fixed;
  bottom:20px;
  left:20px;
  width:58px;
  height:58px;
  border-radius:50%;
  background:#25d366;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  box-shadow:0 4px 15px rgba(37,211,102,.4);
  z-index:1000;
}

/* TOAST */
.toast{
  position:fixed;
  bottom:90px;
  left:50%;
  transform:translateX(-50%);
  background:var(--card);
  color:var(--text);
  padding:11px 18px;
  border-radius:50px;
  font-size:12px;
  border:1px solid var(--border);
  z-index:3000;
  display:none;
  white-space:nowrap;
}

.toast.show{
  display:block;
}

/* HINT */
.hint{
  position:fixed;
  bottom:80px;
  left:50%;
  transform:translateX(-50%);
  background:var(--accent);
  color:#000;
  padding:8px 16px;
  border-radius:50px;
  font-size:12px;
  font-weight:700;
  display:none;
  z-index:3000;
}

.hint.show{
  display:block;
}
</style>
</head>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
'https://ocheynyjboagfybazcsi.supabase.co';

const SUPABASE_KEY =
'sb_publishable_kL_nA7Fv-uHbC5mx8Hqm6A_XluBgT29';


/* =====================================================
   VARIÁVEIS
===================================================== */

let products = [];

let favorites =
JSON.parse(localStorage.getItem('jp_fav') || '[]');

let cat = 'todos';


/* =====================================================
   FUNÇÕES BÁSICAS
===================================================== */

function fmt(value){

  const number = Number(value) || 0;

  return 'R$ ' +
    number.toFixed(2).replace('.',',');

}


function disc(oldPrice,price){

  if(!oldPrice || oldPrice <= price){
    return '';
  }

  return '-' +
    Math.round(
      ((oldPrice-price)/oldPrice)*100
    ) +
    '%';

}


function toast(message){

  const t =
    document.getElementById('toast');

  t.textContent = message;

  t.classList.add('show');

  setTimeout(()=>{
    t.classList.remove('show');
  },2500);

}


/* =====================================================
   CARREGAR PRODUTOS DO SUPABASE
===================================================== */

async function loadProducts(){

  const grid =
    document.getElementById('grid');

  grid.innerHTML =
    '<div class="loading">Carregando produtos...</div>';

  try{

    /*
      IMPORTANTE:
      Não usamos created_at aqui.
      Assim não quebra caso essa coluna
      não exista na sua tabela.
    */

    const url =
      SUPABASE_URL +
      '/rest/v1/produtos?ativo=eq.true&select=*';

    const response =
      await fetch(url,{
        method:'GET',

        headers:{
          'apikey':SUPABASE_KEY,
          'Authorization':'Bearer '+SUPABASE_KEY,
          'Accept':'application/json'
        }
      });


    if(!response.ok){

      const errorText =
        await response.text();

      throw new Error(
        'Supabase '+response.status+
        ' - '+errorText
      );

    }


    const data =
      await response.json();


    products =
      data.map(p=>({

        id:p.id,

        name:p.nome || 'Produto',

        price:
          Number(p.preco_atual) || 0,

        oldPrice:
          Number(p.preco_antigo) || null,

        image:
          p.imagem_url ||
          'https://via.placeholder.com/500?text=JP',

        platform:
          String(p.loja_origem || '').toLowerCase()
            .includes('mercado')
              ? 'mercado-livre'
              : String(p.loja_origem || '').toLowerCase()
                  .includes('shopee')
                    ? 'shopee'
                    : String(p.loja_origem || '').toLowerCase()
                        .includes('shein')
                          ? 'shein'
                          : 'outro',

        bestseller:
          p.destaque === true,

        link:
          p.link_afiliado || '',

        categoria:
          p.categoria || '',

        tipo:
          p.tipo || 'afiliado',

        paymentLink:
          p.link_pagamento || ''

      }));


    document.getElementById('count')
      .textContent = products.length;


    render();


  }catch(error){

    console.error(error);

    grid.innerHTML = `
      <div class="error-box">
        ❌ Não foi possível carregar os produtos.
        <br><br>
        <small>${escapeHTML(error.message)}</small>
        <br><br>
        <button
          onclick="loadProducts()"
          style="
            padding:10px 18px;
            border:0;
            border-radius:30px;
            background:#00e676;
            color:#000;
            font-weight:bold;">
          🔄 Tentar novamente
        </button>
      </div>
    `;

  }

}


/* =====================================================
   PROTEÇÃO DE TEXTO
===================================================== */

function escapeHTML(text){

  return String(text)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}


/* =====================================================
   ABRIR PRODUTO
===================================================== */

function comprarProduto(id){

  const p =
    products.find(
      product => String(product.id) === String(id)
    );

  if(!p){

    toast('Produto não encontrado ❌');

    return;

  }


  /*
    DROPSHIPPING:
    abre o checkout do seu próprio site.
  */

  if(
    String(p.tipo).toLowerCase() ===
    'dropshipping'
  ){

    window.location.href =
      'checkout.html?id=' +
      encodeURIComponent(p.id);

    return;

  }


  /*
    AFILIADO:
    pega o link do banco.
  */

  let link =
    String(p.link || '').trim();


  if(!link){

    toast('Este produto ainda não possui link de compra ❌');

    return;

  }


  /*
    Se alguém colocou:
    www.mercadolivre...
    em vez de https://...
  */

  if(
    !link.startsWith('http://') &&
    !link.startsWith('https://')
  ){

    link = 'https://' + link;

  }


  /*
    ABRE O LINK EXTERNO.
  */

  window.open(
    link,
    '_blank',
    'noopener,noreferrer'
  );

}


/* =====================================================
   RENDERIZAR SUGESTÕES
===================================================== */

function renderSuggestions(){

  const box =
    document.getElementById('suggestions');

  const input =
    document.getElementById('search');

  const q =
    input.value.toLowerCase().trim();


  if(!q){

    box.classList.remove('show');

    box.innerHTML='';

    render();

    return;

  }


  const matches =
    products
      .filter(p =>
        p.name
          .toLowerCase()
          .includes(q)
      )
      .slice(0,6);


  if(!matches.length){

    box.classList.remove('show');

    box.innerHTML='';

  }else{

    box.innerHTML =
      matches.map(p=>`

        <div
          class="suggestion-item"
          onclick="pickSuggestion('${String(p.id).replace(/'/g,"\\'")}')">

          <img
            src="${escapeHTML(p.image)}"
            onerror="this.src='https://via.placeholder.com/40?text=JP'">

          <span>
            ${escapeHTML(p.name)}
          </span>

        </div>

      `).join('');

    box.classList.add('show');

  }


  render();

}


function pickSuggestion(id){

  const p =
    products.find(
      product =>
        String(product.id) === String(id)
    );

  if(!p)return;


  document.getElementById('search').value =
    p.name;

  document
    .getElementById('suggestions')
    .classList.remove('show');

  render();

}


document.addEventListener('click',function(e){

  const box =
    document.getElementById('suggestions');

  const input =
    document.getElementById('search');

  if(
    box &&
    input &&
    !box.contains(e.target) &&
    e.target !== input
  ){

    box.classList.remove('show');

  }

});


/* =====================================================
   RENDER PRODUTOS
===================================================== */

function render(){

  let list = [...products];


  if(cat === 'mercado-livre'){

    list =
      list.filter(
        p => p.platform === 'mercado-livre'
      );

  }


  else if(cat === 'shopee'){

    list =
      list.filter(
        p => p.platform === 'shopee'
      );

  }


  else if(cat === 'shein'){

    list =
      list.filter(
        p => p.platform === 'shein'
      );

  }


  else if(cat === 'fav'){

    list =
      list.filter(
        p => favorites.includes(String(p.id))
      );

  }


  const q =
    document
      .getElementById('search')
      .value
      .toLowerCase()
      .trim();


  if(q){

    list =
