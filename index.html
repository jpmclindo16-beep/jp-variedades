<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>JP_variedades</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --bg: #000000;
      --surface: #1c1c1e;
      --surface-light: #2c2c2e;
      --surface-hover: #3a3a3c;
      --text: #ffffff;
      --text-muted: #8e8e93;
      --green: #00e676;
      --green-dark: #00c853;
      --border: #2c2c2e;
      --radius-sm: 12px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-xl: 32px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      padding-bottom: 100px;
    }

    .top-banner {
      background: var(--green);
      color: #000;
      text-align: center;
      padding: 10px 16px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .top-banner i { font-size: 0.9rem; }

    .header {
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, #333, #1a1a1a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text);
      border: 2px solid var(--surface-light);
      flex-shrink: 0;
      overflow: hidden;
    }

    .header-info {
      flex: 1;
      min-width: 0;
    }

    .header-name {
      font-size: 1.1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .verified {
      color: var(--green);
      font-size: 1rem;
    }

    .header-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .header-search {
      flex: 1;
      max-width: 160px;
    }

    .header-search input {
      width: 100%;
      padding: 10px 14px 10px 36px;
      border-radius: var(--radius-xl);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.85rem;
      outline: none;
      font-family: inherit;
    }

    .header-search input::placeholder { color: var(--text-muted); }

    .search-wrap { position: relative; }

    .search-wrap i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    .bio-section {
      margin: 0 16px 20px;
      background: linear-gradient(180deg, rgba(0,230,118,0.08) 0%, var(--surface) 100%);
      border-radius: var(--radius-lg);
      padding: 28px 20px 20px;
      text-align: center;
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }

    .bio-section::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--green), transparent);
    }

    .bio-logo {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2a2a2a, #1a1a1a);
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 800;
      border: 2px solid var(--surface-light);
    }

    .bio-title {
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .bio-text {
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .bio-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.05);
      padding: 10px 18px;
      border-radius: var(--radius-xl);
      font-size: 0.8rem;
      color: var(--text-muted);
      flex-wrap: wrap;
      justify-content: center;
    }

    .bio-badge i { color: #fbbf24; }
    .bio-badge .check { color: var(--green); }

    .vantagens {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 0 16px 20px;
    }

    .vantagem-card {
      background: var(--surface);
      border-radius: var(--radius-md);
      padding: 16px 12px;
      text-align: center;
      border: 1px solid var(--border);
    }

    .vantagem-icon {
      font-size: 1.3rem;
      margin-bottom: 8px;
    }

    .vantagem-title {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--green);
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .vantagem-desc {
      font-size: 0.7rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .filtros-scroll {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 0 16px 16px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .filtros-scroll::-webkit-scrollbar { display: none; }

    .filtro-pill {
      flex-shrink: 0;
      padding: 10px 22px;
      border-radius: var(--radius-xl);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      white-space: nowrap;
    }

    .filtro-pill.active {
      background: var(--text);
      color: #000;
      border-color: var(--text);
      font-weight: 600;
    }

    .secao-titulo {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 16px 12px;
      font-size: 1rem;
      font-weight: 700;
    }

    .secao-titulo i {
      color: var(--green);
      font-size: 1.1rem;
    }

    .secao-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px 12px;
    }

    .secao-header h2 {
      font-size: 1.3rem;
      font-weight: 800;
    }

    .secao-header span {
      font-size: 0.85rem;
      color: var(--text-muted);
      background: var(--surface);
      padding: 6px 14px;
      border-radius: var(--radius-xl);
    }

    .ranking-list {
      padding: 0 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .ranking-card {
      background: var(--surface);
      border-radius: var(--radius-md);
      padding: 14px;
      display: flex;
      gap: 14px;
      align-items: center;
      border: 1px solid var(--border);
      position: relative;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .ranking-card:active { transform: scale(0.98); }

    .ranking-img-wrap {
      position: relative;
      flex-shrink: 0;
    }

    .ranking-img {
      width: 90px;
      height: 90px;
      border-radius: var(--radius-sm);
      object-fit: cover;
      background: var(--surface-light);
    }

    .ranking-num {
      position: absolute;
      top: -6px;
      left: -6px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--surface);
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .ranking-info {
      flex: 1;
      min-width: 0;
    }

    .ranking-name {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .ranking-stars {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .ranking-stars .stars {
      color: var(--green);
      letter-spacing: 1px;
    }

    .ranking-price {
      font-size: 1.2rem;
      font-weight: 800;
    }

    .ranking-btn {
      flex-shrink: 0;
      padding: 10px 24px;
      background: var(--green);
      color: #000;
      border: none;
      border-radius: var(--radius-xl);
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }

    .ranking-btn:active { transform: scale(0.95); }

    .produtos-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 0 16px;
    }

    .produto-card {
      background: var(--surface);
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: transform 0.2s;
    }

    .produto-card:active { transform: scale(0.97); }

    .produto-img-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      overflow: hidden;
    }

    .produto-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: var(--surface-light);
    }

    .produto-badges-top {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 6px;
      pointer-events: none;
    }

    .badge-ml {
      background: var(--green);
      color: #000;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .badge-desconto {
      background: var(--surface);
      color: var(--text);
      padding: 4px 10px;
      border-radius: var(--radius-xl);
      font-size: 0.7rem;
      font-weight: 700;
      border: 1px solid var(--border);
    }

    .badge-mais-vendido {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: var(--green);
      color: #000;
      padding: 5px 12px;
      border-radius: var(--radius-sm);
      font-size: 0.65rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .produto-info {
      padding: 12px;
    }

    .produto-name {
      font-size: 0.85rem;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .produto-avaliacao {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
    }

    .produto-avaliacao .stars {
      color: var(--green);
      letter-spacing: 1px;
    }

    .produto-avaliacao .nota {
      font-weight: 700;
    }

    .produto-avaliacao .qtd {
      color: var(--text-muted);
    }

    .skeleton-card {
      background: var(--surface);
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .skeleton-img {
      aspect-ratio: 1;
      background: linear-gradient(90deg, var(--surface-light) 25%, var(--surface-hover) 50%, var(--surface-light) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }

    .skeleton-text {
      padding: 12px;
    }

    .skeleton-line {
      height: 14px;
      background: linear-gradient(90deg, var(--surface-light) 25%, var(--surface-hover) 50%, var(--surface-light) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 4px;
      margin-bottom: 8px;
    }

    .skeleton-line.short { width: 60%; }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .empty-state {
      text-align: center;
      padding: 40px 24px;
      grid-column: 1 / -1;
      color: var(--text-muted);
    }

    .empty-state i {
      font-size: 2.5rem;
      margin-bottom: 12px;
      display: block;
    }

    .fab-wa {
      position: fixed;
      bottom: 24px;
      right: 20px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #25d366;
      color: white;
      border: none;
      font-size: 1.6rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4);
      z-index: 100;
      transition: transform 0.2s;
    }

    .fab-wa:active { transform: scale(0.9); }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 200;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
    }

    .overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .sidebar {
      position: fixed;
      top: 0;
      right: 0;
      width: 100%;
      max-width: 400px;
      height: 100vh;
      background: var(--bg);
      border-left: 1px solid var(--border);
      z-index: 201;
      transform: translateX(100%);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
    }

    .sidebar.open { transform: translateX(0); }

    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-header h2 {
      font-size: 1.1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sidebar-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sidebar-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .cart-item {
      display: flex;
      gap: 12px;
      padding: 12px;
      background: var(--surface);
      border-radius: var(--radius-sm);
      margin-bottom: 10px;
      border: 1px solid var(--border);
    }

    .cart-item img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 8px;
      background: var(--surface-light);
      flex-shrink: 0;
    }

    .cart-item-info { flex: 1; min-width: 0; }

    .cart-item-name {
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cart-item-price {
      color: var(--green);
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 6px;
    }

    .cart-item-qty {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .qty-btn {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface-light);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
    }

    .cart-item-qty span {
      font-size: 0.85rem;
      font-weight: 600;
      min-width: 20px;
      text-align: center;
    }

    .remove-btn {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 0.75rem;
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .cart-empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .cart-empty i {
      font-size: 2.5rem;
      margin-bottom: 12px;
      display: block;
    }

    .sidebar-footer {
      padding: 20px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    .cart-total-row {
      display: flex;
      justify-content: space-between;
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .cart-total-row span:last-child { color: var(--green); }

    .btn-finalizar {
      width: 100%;
      padding: 14px;
      background: var(--green);
      color: #000;
      border: none;
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 250;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
    }

    .modal-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .modal-sheet {
      background: var(--surface);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      width: 100%;
      max-width: 500px;
      max-height: 85vh;
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .modal-overlay.open .modal-sheet {
      transform: translateY(0);
    }

    .modal-img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      background: var(--surface-light);
    }

    .modal-body {
      padding: 20px;
    }

    .modal-name {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .modal-price {
      font-size: 1.6rem;
      color: var(--green);
      font-weight: 800;
      margin-bottom: 12px;
    }

    .modal-desc {
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .modal-btns {
      display: flex;
      gap: 10px;
    }

    .modal-btns button {
      flex: 1;
      padding: 14px;
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-add {
      background: var(--green);
      color: #000;
    }

    .btn-wa {
      background: #25d366;
      color: white;
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(0,0,0,0.6);
      border: none;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      backdrop-filter: blur(4px);
    }

    .toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--surface);
      color: var(--text);
      padding: 12px 24px;
      border-radius: var(--radius-xl);
      border: 1px solid var(--border);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      z-index: 300;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      font-weight: 500;
      opacity: 0;
      transition: all 0.3s;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast i { color: var(--green); }

    .cart-icon-header {
      position: relative;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      font-size: 1rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    .cart-icon-header .count {
      position: absolute;
      top: -4px;
      right: -4px;
      background: var(--green);
