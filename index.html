<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0a">

<title>JP Variedades</title>

<style>
:root{
  --bg:#0a0a0a;
  --card:#1a1a1a;
  --border:#2a2a2a;
  --text:#fff;
  --muted:#999;
  --accent:#00e676;
  --accent-dark:#00c853;
  --danger:#ff5252;
}

body.light{
  --bg:#f5f5f5;
  --card:#fff;
  --border:#ddd;
  --text:#111;
  --muted:#666;
  --accent:#00c853;
  --accent-dark:#009624;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  background:var(--bg);
  color:var(--text);
  min-height:100%;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  min-height:100vh;
  transition:.3s;
}

/* BANNER */

.banner{
  background:linear-gradient(90deg,var(--accent-dark),var(--accent));
  color:#000;
  text-align:center;
  padding:10px;
  font-size:13px;
  font-weight:800;
}

/* HEADER */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:12px 16px;
  background:var(--card);
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.logo-circle{
  width:44px;
  height:44px;
  min-width:44px;
  border-radius:50%;
  background:url("logo%20(2).png") center/cover no-repeat;
  cursor:pointer;
}

.logo h1{
  font-size:16px;
  white-space:nowrap;
}

.logo p{
  font-size:12px;
  color:var(--muted);
}

.actions{
  display:flex;
  gap:7px;
}

.btn-icon{
  width:38px;
  height:38px;
  border-radius:50%;
  border:0;
  background:var(--border);
  color:var(--text);
  font-size:17px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* SEARCH */

.search{
  padding:14px 16px;
  position:relative;
}

.search input{
  width:100%;
  padding:14px 18px;
  border-radius:50px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  font-size:15px;
  outline:none;
}

.search input::placeholder{
  color:var(--muted);
}

.suggestions{
  position:absolute;
  left:16px;
  right:16px;
  top:62px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
  display:none;
  z-index:500;
}

.suggestions.show{
  display:block;
}

.suggestion-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  cursor:pointer;
}

.suggestion-item:hover{
  background:var(--border);
}

.suggestion-item img{
  width:42px;
  height:42px;
  border-radius:8px;
  object-fit:cover;
}

.suggestion-item span{
  font-size:13px;
}

/* HERO */

.hero{
  text-align:center;
  padding:28px 16px 20px;
}

.big-logo{
  width:110px;
  height:110px;
  border-radius:50%;
  margin:0 auto 15px;
  background:url("logo%20(2).png") center/cover no-repeat;
  cursor:pointer;
}

.hero h2{
  font-size:25px;
  margin-bottom:8px;
}

.hero p{
  color:var(--muted);
  font-size:14px;
  max-width:350px;
  margin:0 auto 20px;
  line-height:1.5;
}

.stats{
  display:flex;
  justify-content:center;
  gap:10px;
}

.stat{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px 15px;
  min-width:90px;
}

.stat b{
  font-size:18px;
  color:var(--accent);
}

.stat span{
  font-size:11px;
  color:var(--muted);
}

/* CATEGORIES */

.cats{
  display:flex;
  gap:8px;
  padding:12px 16px;
  overflow-x:auto;
  scrollbar-width:none;
}

.cats::-webkit-scrollbar{
  display:none;
}

.cats button{
  padding:10px 17px;
  border-radius:50px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--muted);
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
  cursor:pointer;
}

.cats button.active{
  background:var(--accent);
  color:#000;
  border-color:var(--accent);
}

/* TITLE */

.sec-title{
  padding:14px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:15px;
  font-weight:800;
}

.sec-title span{
  background:var(--border);
  color:var(--muted);
  padding:6px 12px;
  border-radius:50px;
  font-size:11px;
}

/* GRID */

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding:0 16px 110px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
}

.card-img{
  position:relative;
  aspect-ratio:1/1;
  background:var(--border);
}

.card-img img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.badge{
  position:absolute;
  top:7px;
  left:7px;
  padding:4px 8px;
  border-radius:50px;
  font-size:9px;
  font-weight:800;
}

.b-ml{
  background:#ffe600;
  color:#000;
}

.b-sh{
  background:#ee4d2d;
  color:#fff;
}

.b-shein{
  background:#111;
  color:#fff;
}

.b-disc{
  background:var(--accent);
  color:#000;
}

.b-ds{
  background:#7c4dff;
  color:#fff;
}

.b-best{
  position:absolute;
  top:7px;
  right:40px;
  background:var(--danger);
  color:#fff;
  padding:4px 7px;
  border-radius:50px;
  font-size:8px;
  font-weight:800;
}

.fav{
  position:absolute;
  top:7px;
  right:7px;
  width:30px;
  height:30px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.55);
  color:#fff;
  cursor:pointer;
}

.fav.active{
  background:var(--danger);
}

.card-info{
  padding:10px;
}

.card-title{
  font-size:12px;
  font-weight:650;
  line-height:1.4;
  margin-bottom:7px;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.card-price{
  font-size:17px;
  font-weight:900;
  color:var(--accent);
}

.card-old{
  text-decoration:line-through;
  color:var(--muted);
  font-size:11px;
  margin-left:5px;
}

.card-discount{
  background:var(--accent);
  color:#000;
  padding:2px 5px;
  border-radius:4px;
  font-size:9px;
  font-weight:800;
  margin-left:5px;
}

.card-foot{
  display:flex;
  gap:7px;
  margin-top:10px;
}

.ver{
  flex:1;
  padding:9px 4px;
  border-radius:50px;
  background:var(--accent);
  color:#000;
  text-decoration:none;
  text-align:center;
  font-size:11px;
  font-weight:900;
}

.share{
  width:34px;
  height:34px;
  border:0;
  border-radius:50%;
  background:var(--border);
  color:var(--text);
  cursor:pointer;
}

/* STATUS */

.loading,
.empty,
.error-box{
  grid-column:1/-1;
  text-align:center;
  padding:45px 20px;
  color:var(--muted);
}

.error-box{
  color:#ff8a80;
  background:var(--card);
  border:1px solid #512;
  border-radius:12px;
}

.error-box button{
  margin-top:15px;
  padding:10px 20px;
  border:0;
  border-radius:50px;
  background:var(--accent);
  color:#000;
  font-weight:800;
}

/* FAVORITOS */

.fav-page{
  display:none;
}

.fav-page.active{
  display:block;
}

/* WHATSAPP */

.whatsapp-float{
  position:fixed;
  bottom:20px;
  left:20px;
  width:58px;
  height:58px;
  border-radius:50%;
  background:#25d366;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 4px 18px rgba(37,211,102,.45);
  z-index:1000;
}

/* TOAST */

.toast{
  position:fixed;
  bottom:90px;
  left:50%;
  transform:translateX(-50%);
  background:var(--card);
  color:var(--text);
  padding:11px 18px;
  border-radius:50px;
  border:1px solid var(--border);
  z-index:3000;
  display:none;
  font-size:12px;
}

.toast.show{
  display:block;
}

/* HINT */

.hint{
  position:fixed;
  bottom:80px;
  left:50%;
  transform:translateX(-50%);
  background:var(--accent);
  color:#000;
  padding:9px 16px;
  border-radius:50px;
  font-size:12px;
  font-weight:800;
  display:none;
  z-index:2000;
}

.hint.show{
  display:block;
}
</style>
</head>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://ocheynyjboagfybazcsi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_kL_nA7Fv-uHbC5mx8Hqm6A_XluBgT29";

/* =====================================================
   VARIÁVEIS
===================================================== */

let products = [];

let favorites =
JSON.parse(localStorage.getItem("jp_fav") || "[]");

let cat = "todos";

/* =====================================================
   FUNÇÕES AUXILIARES
===================================================== */

function fmt(value){

  const number = Number(value || 0);

  return "R$ " +
    number.toFixed(2).replace(".", ",");

}

function disc(oldPrice, price){

  if(!oldPrice || oldPrice <= price){
    return "";
  }

  return "-" +
    Math.round(
      ((oldPrice-price)/oldPrice)*100
    ) +
    "%";

}

function toast(message){

  const t =
    document.getElementById("toast");

  t.textContent = message;

  t.classList.add("show");

  setTimeout(()=>{
    t.classList.remove("show");
  },2500);

}

/* =====================================================
   CARREGAR PRODUTOS DO SUPABASE
===================================================== */

async function loadProducts(){

  const grid =
    document.getElementById("grid");

  grid.innerHTML =
    '<div class="loading">🔄 Conectando ao banco...</div>';

  try{

    const url =
      SUPABASE_URL +
      "/rest/v1/produtos" +
      "?ativo=eq.true" +
      "&order=created_at.desc";

    const response =
      await fetch(url,{
        method:"GET",

        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer "+SUPABASE_KEY,
          "Content-Type":"application/json",
          "Accept":"application/json"
        }
      });

    const text =
      await response.text();

    if(!response.ok){

      throw new Error(
        "Supabase HTTP " +
        response.status +
        ": " +
        text
      );

    }

    let data;

    try{
      data = JSON.parse(text);
    }catch{
      throw new Error(
        "O Supabase não retornou JSON válido."
      );
    }

    if(!Array.isArray(data)){

      throw new Error(
        "Resposta do banco inválida."
      );

    }

    products =
      data.map(p=>({

        id:p.id,

        name:
          p.nome ||
          "Produto sem nome",

        price:
          Number(p.preco_atual || 0),

        oldPrice:
          Number(p.preco_antigo || 0) || null,

        image:
          p.imagem_url ||
          "https://via.placeholder.com/500?text=JP+Variedades",

        platform:
          String(p.loja_origem || "").toLowerCase()
          .includes("mercado")
            ? "mercado-livre"
            : String(p.loja_origem || "").toLowerCase()
            .includes("shopee")
            ? "shopee"
            : String(p.loja_origem || "").toLowerCase()
            .includes("shein")
            ? "shein"
            : "outro",

        bestseller:
          Boolean(p.destaque),

        link:
          p.link_afiliado || "",

        categoria:
          p.categoria || "",

        tipo:
          p.tipo || "afiliado",

        paymentLink:
          p.link_pagamento || ""

      }));

    document.getElementById("count").textContent =
      products.length;

    render();

  }catch(error){

    console.error(
      "ERRO SUPABASE:",
      error
    );

    grid.innerHTML = `

      <div class="error-box">

        ❌ Não foi possível carregar os produtos.

        <br><br>

        <small>
        ${escapeHTML(error.message)}
        </small>

        <br>

        <button onclick="loadProducts()">
          🔄 Tentar novamente
        </button>

      </div>

    `;

  }

}

/* =====================================================
   SEGURANÇA DO TEXTO
===================================================== */

function escapeHTML(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

/* =====================================================
   ESCAPAR URL
===================================================== */

function safeURL(url){

  if(!url){
    return "#";
  }

  return String(url)
    .replace(/"/g,"%22")
    .replace(/'/g,"%27")
    .replace(/</g,"%3C")
    .replace(/>/g,"%3E");

}

/* =====================================================
   BUSCA
===================================================== */

function renderSuggestions(){

  const box =
    document.getElementById("suggestions");

  const q =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();

  if(!q){

    box.classList.remove("show");

    box.innerHTML = "";

    render();

    return;

  }

  const matches =
    products
      .filter(p =>
        p.name
          .toLowerCase()
          .includes(q)
      )
      .slice(0,6);

  if(!matches.length){

    box.classList.remove("show");

    box.innerHTML = "";

  }else{

    box.innerHTML =
      matches.map(p=>`

        <div
          class="suggestion-item"
          onclick="pickSuggestion('${String(p.id)}')"
        >

          <img
            src="${safeURL(p.image)}"
            onerror="this.src='https://via.placeholder.com/50?text=JP'"
          >

          <span>
            ${escapeHTML(p.name)}
          </span>

        </div>

      `).join("");

    box.classList.add("show");

  }

  render();

}

function pickSuggestion(id){

  const product =
    products.find(
      p => String(p.id) === String(id)
    );

  if(!product){
    return;
  }

  document.getElementById("search").value =
    product.name;

  document
    .getElementById("suggestions")
    .classList.remove("show");

  render();

}

document.addEventListener("click",function(event){

  const box =
    document.getElementById("suggestions");

  const input =
    document.getElementById("search");

  if(
    box &&
    input &&
    !box.contains(event.target) &&
    event.target !== input
  ){

    box.classList.remove("show");

  }

});

/* =====================================================
   RENDER PRODUTOS
===================================================== */

function render(){

  let list = [...products];

  if(cat === "mercado-livre"){

    list =
      list.filter(
        p => p.platform === "mercado-livre"
      );

  }

  if(cat === "shopee"){

    list =
      list.filter(
        p => p.platform === "shopee"
      );

  }

  if(cat === "shein"){

    list =
      list.filter(
        p => p.platform === "shein"
      );

  }

  if(cat === "fav"){

    list =
      list.filter(
        p => favorites
          .map(String)
          .includes(String(p.id))
      );

  }

  const q =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();

  if(q){

    list =
      list.filter(
        p =>
          p.name
            .toLowerCase()
            .includes(q)
      );

  }

  document.getElementById("count")
    .textContent = products.length;

  document.getElementById("vcount")
    .textContent =
      list.length + " produtos";

  const grid =
    document.getElementById("grid");

  if(!list.length){

    grid.innerHTML =
      '<div class="empty">Nenhum produto encontrado.</div>';

    return;

  }

  grid.innerHTML =
    list.map(createProductCard).join("");

}

/* =====================================================
   CARD DO PRODUTO
===================================================== */

function createProductCard(p){

  const favorite =
    favorites
      .map(String)
      .includes(String(p.id));

  const discount =
    disc(p.oldPrice,p.price);

  let badge = "";
