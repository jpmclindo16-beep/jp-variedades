<style>
:root{--bg:#0a0a0a;--card:#1a1a1a;--border:#2a2a2a;--text:#fff;--muted:#a0a0a0;--accent:#00e676;--accent-dark:#00c853;--danger:#ff5252}
body.light{--bg:#f5f5f5;--card:#fff;--border:#ddd;--text:#1a1a1a;--muted:#666;--accent:#00c853;--accent-dark:#009624}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s}

.banner{background:linear-gradient(90deg,var(--accent-dark),var(--accent));color:#000;text-align:center;padding:10px;font-size:13px;font-weight:700}

.header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:10px}
.logo-circle{width:44px;height:44px;border-radius:50%;background:url('logo%20(2).png') center/cover;cursor:pointer;user-select:none}
.logo h1{font-size:16px}.logo p{font-size:12px;color:var(--muted)}
.actions{display:flex;gap:8px;align-items:center}
.btn-icon{width:36px;height:36px;border-radius:50%;border:none;background:var(--border);color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;position:relative}

.search{padding:12px 16px;position:relative}
.search input{width:100%;padding:12px 16px;border-radius:50px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14px;outline:none}
.search input::placeholder{color:var(--muted)}
.suggestions{position:absolute;top:100%;left:16px;right:16px;background:var(--card);border:1px solid var(--border);border-radius:12px;margin-top:4px;max-height:280px;overflow-y:auto;z-index:50;display:none}
.suggestions.show{display:block}
.suggestion-item{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer}
.suggestion-item:hover{background:var(--border)}
.suggestion-item img{width:36px;height:36px;border-radius:6px;object-fit:cover}
.suggestion-item span{font-size:13px;color:var(--text)}

.hero{text-align:center;padding:20px 16px}
.hero .big-logo{width:80px;height:80px;margin:0 auto 12px;border-radius:50%;background:url('logo%20(2).png') center/cover;cursor:pointer}
.hero h2{font-size:22px;margin-bottom:6px}
.hero p{color:var(--muted);font-size:13px;max-width:300px;margin:0 auto 16px}
.stats{display:flex;justify-content:center;gap:12px}
.stat{background:var(--card);padding:10px 16px;border-radius:10px;border:1px solid var(--border);text-align:center;min-width:80px}
.stat b{font-size:16px;color:var(--accent)}.stat span{font-size:10px;color:var(--muted)}

.cats{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{padding:8px 16px;border-radius:50px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.cats button.active{background:var(--accent);color:#000;border-color:var(--accent)}

.sort-bar{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto}
.sort-bar select{padding:8px 12px;border-radius:50px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:12px;outline:none}

.sec-title{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700}
.sec-title span{background:var(--border);padding:4px 10px;border-radius:50px;font-size:11px;color:var(--muted)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 100px}
.card{background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--border);transition:transform .2s}
.card:active{transform:scale(.98)}
.card-img{position:relative;aspect-ratio:1;background:var(--border)}
.card-img img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:6px;left:6px;padding:3px 8px;border-radius:50px;font-size:9px;font-weight:700}
.b-ml{background:#ffe600;color:#000}.b-sh{background:#ee4d2d;color:#fff}.b-disc{background:var(--accent);color:#000}
.b-ds{background:#7c4dff;color:#fff}
.b-best{position:absolute;top:6px;right:36px;padding:3px 8px;border-radius:50px;font-size:9px;font-weight:700;background:var(--danger);color:#fff}
.fav{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;border:none;background:rgba(0,0,0,.5);color:#fff;cursor:pointer;font-size:14px}
.fav.active{background:var(--danger)}
.card-info{padding:10px}
.card-title{font-size:12px;font-weight:600;line-height:1.4;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-price{font-size:16px;font-weight:800;color:var(--accent)}
.card-old{text-decoration:line-through;color:var(--muted);font-size:11px;margin-left:6px}
.card-discount{background:var(--accent);color:#000;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:700;margin-left:6px}
.card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px}
.ver{flex:1;padding:8px 0;border-radius:50px;border:none;background:var(--accent);color:#000;font-size:12px;font-weight:700;cursor:pointer;text-align:center;text-decoration:none}
.share{width:32px;height:32px;border-radius:50%;border:none;background:var(--border);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center}

.skeleton{background:linear-gradient(90deg,var(--border) 25%,var(--card) 50%,var(--border) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:12px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skel-card{height:280px}

.empty{text-align:center;padding:40px 20px;color:var(--muted);grid-column:1/-1;font-size:14px}

.fav-page{display:none}.fav-page.active{display:block}

.whatsapp-float{position:fixed;bottom:20px;left:20px;width:56px;height:56px;border-radius:50%;background:#25d366;color:#fff;display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 4px 12px rgba(37,211,102,.4);z-index:500}

.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--card);color:var(--text);padding:10px 18px;border-radius:50px;font-size:12px;border:1px solid var(--border);z-index:3000;display:none;white-space:nowrap}
.toast.show{display:block}
.hint{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--accent);color:#000;padding:8px 16px;border-radius:50px;font-size:12px;font-weight:700;display:none;z-index:200}
.hint.show{display:block}

#cartBadge{position:absolute;top:-4px;right:-4px;background:var(--accent);color:#000;font-size:10px;font-weight:800;border-radius:50%;min-width:16px;height:16px;display:none;align-items:center;justify-content:center;padding:0 3px}
</style>
</head>

<script>
const SUPABASE_URL = 'https://ocheynyjboagfybazcsi.supabase.co';
const SUPABASE_KEY = 'sb_publishable_kL_nA7Fv-uHbC5mx8Hqm6A_XluBgT29';

let products = [];
let favorites = JSON.parse(localStorage.getItem('jp_fav') || '[]');
let cat = 'todos';

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function fmt(p) {
  return 'R$ ' + Number(p).toFixed(2).replace('.', ',');
}

function disc(oldP, currentP) {
  if (!oldP || oldP <= currentP) return '';
  return '-' + Math.round((oldP - currentP) / oldP * 100) + '%';
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

async function loadProducts() {
  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/produtos?ativo=eq.true&order=created_at.desc', {
      method: 'GET',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'Accept': 'application/json'
      }
    });
    if (!res.ok) throw new Error('Erro ' + res.status);

    const data = await res.json();
    products = data.map(p => ({
      id: p.id,
      name: p.nome || 'Produto',
      price: parseFloat(p.preco_atual || 0),
      oldPrice: parseFloat(p.preco_antigo || 0) || null,
      image: p.imagem_url || '',
      platform: p.loja_origem === 'Mercado Livre' ? 'mercado-livre' :
                p.loja_origem === 'Shopee' ? 'shopee' :
                p.loja_origem === 'Shein' ? 'shein' : 'outro',
      bestseller: !!p.destaque,
      link: p.link_afiliado || '#',
      categoria: p.categoria || '',
      tipo: p.tipo || 'afiliado',
      paymentLink: p.link_pagamento || '',
      tamanhos: p.tamanhos || ''
    }));

    render();
    updateCartBadge();
  } catch (e) {
    document.getElementById('grid').innerHTML = `<div class="empty">Erro ao carregar produtos.<br><small>${escapeHtml(e.message)}</small></div>`;
  }
}

function renderSuggestions() {
  const box = document.getElementById('suggestions');
  const q = document.getElementById('search').value.toLowerCase().trim();

  if (!q) {
    box.classList.remove('show');
    box.innerHTML = '';
    render();
    return;
  }

  const matches = products.filter(p => p.name.toLowerCase().includes(q)).slice(0, 6);

  if (!matches.length) {
    box.classList.remove('show');
    box.innerHTML = '';
  } else {
    box.innerHTML = matches.map(p => `
      <div class="suggestion-item" onclick="pickSuggestion('${p.id}')">
        <img src="${escapeHtml(p.image)}" onerror="this.src='https://via.placeholder.com/40x40/1a1a1a/00e676?text=JP'">
        <span>${escapeHtml(p.name)}</span>
      </div>
    `).join('');
    box.classList.add('show');
  }
  render();
}

function firstImage(v) {
  if (Array.isArray(v)) return v.map(x => String(x).trim()).filter(Boolean)[0] || '';
  const s = String(v || '').trim();
  if (!s) return '';
  try {
    if (s[0] === '[') {
      const arr = JSON.parse(s);
      if (Array.isArray(arr)) return arr.map(x => String(x).trim()).filter(Boolean)[0] || '';
    }
  } catch(e) {}
  return s.split(/[\n,]+/).map(x => x.trim()).filter(Boolean)[0] || '';
}

function pickSuggestion(id) {
  const p = products.find(p => p.id == id);
  if (!p) return;
  document.getElementById('search').value = p.name;
  document.getElementById('suggestions').classList.remove('show');
  render();
}

document.addEventListener('click', function (e) {
  const box = document.getElementById('suggestions');
  const input = document.getElementById('search');
  if (box && input && !box.contains(e.target) && e.target !== input) {
    box.classList.remove('show');
  }
});

function getSortedList(list) {
  const sort = document.getElementById('sortSelect')?.value || 'recent';

  if (sort === 'price-asc') return [...list].sort((a, b) => a.price - b.price);
  if (sort === 'price-desc') return [...list].sort((a, b) => b.price - a.price);
  if (sort === 'discount') {
    return [...list].sort((a, b) => {
      const da = a.oldPrice ? (a.oldPrice - a.price) / a.oldPrice : 0;
      const db = b.oldPrice ? (b.oldPrice - b.price) / b.oldPrice : 0;
      return db - da;
    });
  }
  if (sort === 'bestseller') return [...list].sort((a, b) => (b.bestseller ? 1 : 0) - (a.bestseller ? 1 : 0));
  return list;
}

function render() {
  let list = products;

  if (cat === 'mercado-livre') list = list.filter(p => p.platform === 'mercado-livre');
  else if (cat === 'shopee') list = list.filter(p => p.platform === 'shopee');
  else if (cat === 'shein') list = list.filter(p => p.platform === 'shein');
  else if (cat === 'fav') list = list.filter(p => favorites.includes(p.id));

  const q = document.getElementById('search').value.toLowerCase().trim();
  if (q) list = list.filter(p => p.name.toLowerCase().includes(q));

  list = getSortedList(list);

  document.getElementById('count').textContent = products.length;
  document.getElementById('vcount').textContent = list.length + ' produtos';

  const g = document.getElementById('grid');

  if (!list.length) {
    g.innerHTML = `<div class="empty">Nenhum produto encontrado 😕<br><small>Tente outra busca ou categoria</small></div>`;
    return;
  }

  g.innerHTML = list.map(p => {
    const d = disc(p.oldPrice, p.price);
    const isFav = favorites.includes(p.id);

    let badge = '';
    if (p.tipo === 'dropshipping') {
      badge = '<span class="badge b-ds">Loja Própria</span>';
    } else if (p.platform === 'mercado-livre') {
      badge = '<span class="badge b-ml">Mercado Livre</span>';
    } else if (p.platform === 'shopee') {
      badge = '<span class="badge b-sh">Shopee</span>';
    } else {
      badge = '<span class="badge b-disc">Oferta</span>';
    }

    const oldPriceHtml = p.oldPrice ? `<span class="card-old">${fmt(p.oldPrice)}</span>` : '';
    const discountHtml = d ? `<span class="card-discount">${d}</span>` : '';

    const temTamanho = (p.tamanhos||'').split(',').map(function(s){return s.trim()}).filter(Boolean).length>0;

    const buyLink = p.tipo === 'dropshipping'
      ? (temTamanho ? ('produto.html?id=' + p.id) : ('produto.html?id=' + p.id))
      : ('produto.html?id=' + p.id);
    const buyTarget = '_self';
    const buyLabel = p.tipo === 'dropshipping'
      ? (temTamanho ? 'VER OPÇÕES →' : 'VER DETALHES →')
      : 'VER DETALHES →';

    const extraBtn = p.tipo === 'dropshipping'
      ? (temTamanho
          ? `<a class="share" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="produto.html?id=${p.id}" onclick="event.stopPropagation()" title="Ver produto">👁️</a>`
          : `<button class="share" onclick="event.stopPropagation();addToCart('${p.id}')" title="Adicionar ao carrinho">🛒</button>`)
      : `<button class="share" onclick="event.stopPropagation();shareProd('${p.id}')">📤</button>`;

    const imgSrc = firstImage(p.image) || 'https://via.placeholder.com/300x300/1a1a1a/00e676?text=JP+Shoppew';

    return `
      <div class="card" onclick="location.href='produto.html?id=${p.id}'">
        <div class="card-img">
          <img src="${escapeHtml(imgSrc)}" 
               alt="${escapeHtml(p.name)}" 
               loading="lazy" 
               onerror="this.onerror=null;this.src='https://via.placeholder.com/300x300/1a1a1a/00e676?text=JP+Shoppew'">
          ${p.bestseller ? '<span class="b-best">🔥 MAIS VENDIDO</span>' : ''}
          ${badge}
 <button class="fav ${isFav ? 'active' : ''}" onclick="event.stopPropagation();toggleFav('${p.id}')">${isFav ? '❤️' : '🤍'}</button>
        </div>
        <div class="card-info">
          <div class="card-title">${escapeHtml(p.name)}</div>
          <div style="display:flex;align-items:center;flex-wrap:wrap;margin-top:4px">
            <span class="card-price">${fmt(p.price)}</span>
            ${oldPriceHtml}
            ${discountHtml}
          </div>
          <div class="card-foot">
            <a href="${escapeHtml(buyLink)}" target="${buyTarget}" class="ver" onclick="event.stopPropagation()">${buyLabel}</a>
            ${extraBtn}
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function renderFav() {
  const list = products.filter(p => favorites.includes(p.id));
  const g = document.getElementById('favGrid');

  if (!list.length) {
    g.innerHTML = `<div class="empty">Você ainda não tem favoritos ❤️<br><small>Toque no coração dos produtos</small></div>`;
    return;
  }

  g.innerHTML = list.map(p => {
    const buyLink = 'produto.html?id=' + p.id;
    const buyTarget = '_self';
    const buyLabel = p.tipo === 'dropshipping' ? 'VER DETALHES →' : 'VER DETALHES →';
    const imgSrc = firstImage(p.image) || 'https://via.placeholder.com/300x300/1a1a1a/00e676?text=JP+Shoppew';

    return `
      <div class="card">
        <div class="card-img">
          <img src="${escapeHtml(imgSrc)}" onerror="this.onerror=null;this.src='https://via.placeholder.com/300x300/1a1a1a/00e676?text=JP+Shoppew'">
          <button class="fav active" onclick="toggleFav('${p.id}')">❤️</button>
        </div>
        <div class="card-info">
          <div class="card-title">${escapeHtml(p.name)}</div>
          <div class="card-price">${fmt(p.price)}</div>
          <div class="card-foot">
            <a href="${escapeHtml(buyLink)}" target="${buyTarget}" class="ver">${buyLabel}</a>
            <button class="share" onclick="shareProd('${p.id}')">📤</button>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function toggleFav(id) {
  const i = favorites.indexOf(id);
  if (i > -1) {
    favorites.splice(i, 1);
    toast('Removido dos favoritos 💔');
  } else {
    favorites.push(id);
    toast('Adicionado aos favoritos ❤️');
  }
  localStorage.setItem('jp_fav', JSON.stringify(favorites));
  render();
  renderFav();
}

function shareProd(id) {
  const p = products.find(x => x.id == id);
  if (p) {
    navigator.clipboard.writeText(p.name + ' - ' + fmt(p.price) + '\n' + p.link);
    toast('Link copiado! 📋');
  }
}

function shareSite() {
  navigator.clipboard.writeText('🔥 JP Shoppew - Os melhores achadinhos!\n' + location.href);
  toast('Link do site copiado! 📋');
}

function setCat(c, btn) {
  cat = c;
  document.querySelectorAll('.cats button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function showFavorites() {
  document.getElementById('mainPage').style.display = 'none';
  document.getElementById('favPage').classList.add('active');
  renderFav();
}

function backMain() {
  document.getElementById('mainPage').style.display = 'block';
  document.getElementById('favPage').classList.remove('active');
}

// Admin secreto
let pressCount = 0;
function setupLP(el) {
  let timer;
  const start = () => {
    timer = setTimeout(() => {
      pressCount++;
      if (pressCount >= 7) {
        pressCount = 0;
        document.getElementById('hint').textContent = '🔐 Admin liberado!';
        document.getElementById('hint').classList.add('show');
        setTimeout(() => {
          document.getElementById('hint').classList.remove('show');
          window.location.href = 'admin.html';
        }, 600);
      } else {
        document.getElementById('hint').textContent = pressCount + '/7...';
        document.getElementById('hint').classList.add('show');
        setTimeout(() => document.getElementById('hint').classList.remove('show'), 700);
      }
    }, 800);
  };
  const end = () => clearTimeout(timer);
  el.addEventListener('mousedown', start);
  el.addEventListener('touchstart', start, { passive: true });
  el.addEventListener('mouseup', end);
  el.addEventListener('mouseleave', end);
  el.addEventListener('touchend', end);
}
setupLP(document.getElementById('adminTrigger'));
setupLP(document.getElementById('heroLogo'));

// Tema
let dark = true;
function toggleTheme() {
  dark = !dark;
  document.body.classList.toggle('light', !dark);
  document.getElementById('themeBtn').textContent = dark ? '🌙' : '☀️';
  localStorage.setItem('jp_theme', dark ? 'dark' : 'light');
}
if (localStorage.getItem('jp_theme') === 'light') {
  dark = false;
  document.body.classList.add('light');
  document.getElementById('themeBtn').textContent = '☀️';
}

// Carrinho
function getCart() {
  try {
    return JSON.parse(localStorage.getItem('jp_cart') || '[]');
  } catch (e) {
    return [];
  }
}

function saveCart(cart) {
  localStorage.setItem('jp_cart', JSON.stringify(cart));
  updateCartBadge();
}

function updateCartBadge() {
  const cart = getCart();
  const total = cart.reduce((a, i) => a + (i.qty || 1), 0);
  const badge = document.getElementById('cartBadge');
  if (!badge) return;
  if (total > 0) {
    badge.textContent = total;
    badge.style.display = 'flex';
  } else {
    badge.style.display = 'none';
  }
}

function addToCart(id) {
  const p = products.find(x => x.id == id);
  if (!p) return;

  const cart = getCart();
  const existing = cart.find(i => i.id == id);

  if (existing) {
    existing.qty = (existing.qty || 1) + 1;
  } else {
    cart.push({
      id: p.id,
      nome: p.name,
      preco: p.price,
      imagem: p.image,
      qty: 1
    });
  }

  saveCart(cart);
  toast('Adicionado ao carrinho 🛒');
}

// Inicia
loadProducts();
updateCartBadge();
