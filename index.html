<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JP_variedades - Os Melhores Achadinhos do Brasil</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #141414;
            --bg-card: #1a1a1a;
            --bg-elevated: #242424;
            --accent: #00e676;
            --accent-light: #69f0ae;
            --accent-dark: #00c853;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --text-muted: #666666;
            --border: #2a2a2a;
            --danger: #ff5252;
            --shadow: 0 4px 20px rgba(0,0,0,0.5);
            --shadow-glow: 0 0 20px rgba(0,230,118,0.15);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="light"] {
            --bg-primary: #f5f5f5;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-elevated: #f0f0f0;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --text-muted: #999999;
            --border: #e0e0e0;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
            --shadow-glow: 0 0 20px rgba(0,230,118,0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            transition: var(--transition);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }

        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10,10,10,0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            transition: var(--transition);
        }
        [data-theme="light"] .header { background: rgba(245,245,245,0.9); }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            gap: 12px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            position: relative;
        }

        .logo {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-dark), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 18px;
            font-style: italic;
            color: #000;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0,230,118,0.3);
        }

        .logo-info h1 {
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .verified {
            width: 16px;
            height: 16px;
            background: var(--accent);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #000;
        }
        .logo-info p {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: var(--bg-elevated);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            font-size: 18px;
        }
        .icon-btn:hover { background: var(--accent); color: #000; transform: scale(1.05); }

        .banner {
            background: linear-gradient(90deg, var(--accent-dark), var(--accent));
            color: #000;
            padding: 8px 16px;
            text-align: center;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .search-container {
            padding: 12px 16px;
        }
        .search-box {
            position: relative;
        }
        .search-box input {
            width: 100%;
            padding: 12px 16px 12px 44px;
            border-radius: 50px;
            border: 1px solid var(--border);
            background: var(--bg-elevated);
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: var(--transition);
        }
        .search-box input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0,230,118,0.1);
        }
        .search-box::before {
            content: '🔍';
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            opacity: 0.6;
        }

        .hero {
            padding: 20px 16px;
            text-align: center;
        }
        .hero-logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 16px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-dark), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 900;
            font-style: italic;
            color: #000;
            box-shadow: 0 0 30px rgba(0,230,118,0.3);
            cursor: pointer;
            user-select: none;
            position: relative;
        }
        .hero-logo::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            opacity: 0;
            transition: var(--transition);
        }
        .hero-logo:active::after {
            opacity: 1;
            transform: scale(1.1);
        }
        .hero h2 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .hero p {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.6;
            max-width: 320px;
            margin: 0 auto 16px;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .stat {
            background: var(--bg-card);
            padding: 12px 20px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            text-align: center;
            min-width: 100px;
        }
        .stat-value {
            font-size: 18px;
            font-weight: 800;
            color: var(--accent);
        }
        .stat-label {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .categories {
            padding: 16px;
            display: flex;
            gap: 10px;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .categories::-webkit-scrollbar { display: none; }
        .category-btn {
            padding: 10px 20px;
            border-radius: 50px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
        }
        .category-btn.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            box-shadow: var(--shadow-glow);
        }
        .category-btn:hover:not(.active) {
            border-color: var(--accent);
            color: var(--text-primary);
        }

        .section-title {
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .section-title h3 {
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title .count {
            background: var(--bg-elevated);
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 0 16px 24px;
        }

        .product-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border);
            transition: var(--transition);
            position: relative;
            cursor: pointer;
        }
        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow);
            border-color: var(--accent);
        }

        .product-image {
            position: relative;
            aspect-ratio: 1;
            overflow: hidden;
            background: var(--bg-elevated);
        }
        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .product-card:hover .product-image img { transform: scale(1.05); }

        .product-badges {
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
        }
        .badge {
            padding: 4px 10px;
            border-radius: 50px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .badge-ml { background: #ffe600; color: #000; }
        .badge-shopee { background: #ee4d2d; color: #fff; }
        .badge-discount { background: var(--accent); color: #000; }
        .badge-bestseller {
            background: var(--accent);
            color: #000;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .favorite-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            transition: var(--transition);
            pointer-events: all;
        }
        .favorite-btn:hover { background: var(--danger); }
        .favorite-btn.active { background: var(--danger); }

        .product-info {
            padding: 12px;
        }
        .product-title {
            font-size: 13px;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 36px;
        }
        .product-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .stars {
            display: flex;
            gap: 2px;
            color: var(--accent);
            font-size: 12px;
        }
        .rating-count {
            font-size: 11px;
            color: var(--text-muted);
        }
        .product-price {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-primary);
        }
        .product-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
        }
        .btn-ver {
            padding: 8px 20px;
            border-radius: 50px;
            border: none;
            background: var(--accent);
            color: #000;
            font-size: 12px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: var(--transition);
            text-transform: uppercase;
        }
        .btn-ver:hover {
            background: var(--accent-light);
            transform: scale(1.05);
            box-shadow: var(--shadow-glow);
        }
        .share-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: var(--bg-elevated);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            transition: var(--transition);
        }
        .share-btn:hover { background: var(--accent); color: #000; }

        .admin-hint {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--accent);
            color: #000;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 700;
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 200;
            pointer-events: none;
            white-space: nowrap;
        }
        .admin-hint.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal {
            background: var(--bg-secondary);
            border-radius: var(--radius);
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transform: scale(0.9) translateY(20px);
            transition: transform 0.3s ease;
            border: 1px solid var(--border);
        }
        .modal-overlay.active .modal {
            transform: scale(1) translateY(0);
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .modal-header h3 {
            font-size: 18px;
            font-weight: 700;
        }
        .modal-close {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: var(--bg-elevated);
            color: var(--text-primary);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        .modal-close:hover { background: var(--danger); color: #fff; }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
        }

        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-secondary);
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: var(--transition);
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0,230,118,0.1);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .image-preview {
            width: 100%;
            aspect-ratio: 1;
            border-radius: var(--radius-sm);
            background: var(--bg-elevated);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-top: 8px;
            border: 2px dashed var(--border);
        }
        .image-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .image-preview .placeholder {
            color: var(--text-muted);
            font-size: 13px;
            text-align: center;
            padding: 20px;
        }

        .btn {
            padding: 14px 24px;
            border-radius: var(--radius-sm);
            border: none;
            font-size: 14px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-primary {
            background: var(--accent);
            color: #000;
            width: 100%;
        }
        .btn-primary:hover {
            background: var(--accent-light);
            box-shadow: var(--shadow-glow);
        }
        .btn-danger {
            background: var(--danger);
            color: #fff;
        }
        .btn-secondary {
            background: var(--bg-elevated);
            color: var(--text-primary);
        }

        .admin-products {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .admin-product-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }
        .admin-product-item img {
            width: 50px;
            height: 50px;
            border-radius: 8px;
